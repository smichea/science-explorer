name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content package
        run: npm run content:validate
      - name: Lint (prettier + eslint)
        run: npm run lint
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Unit and content tests
        run: npm test
      - name: Build (GitHub Pages base path)
        run: npm run build
        env:
          BASE_PATH: /science-explorer
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 7

  e2e:
    name: End-to-end (phone, tablet, desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run Playwright journeys
        run: npm run test:e2e
        env:
          BASE_PATH: /science-explorer
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
