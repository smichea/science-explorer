# Authored routes through the universe (recommended, thematic, historical).
# The nodes of a route are written in the order they are meant to be visited: a prerequisite
# always before the destinations that need it (the compiler checks the flights built from them).
# Missions belong to routes as practice steps; the bird's-eye flight never stops on them.
routes:
  - id: route.seconde.numbers_functions
    kind: recommended
    stage: seconde
    title:
      fr: "Seconde : des nombres aux fonctions"
      en: "Grade 10: from numbers to functions"
    summary:
      fr: "La première année du lycée en mathématiques : le vocabulaire de la logique, les ensembles de nombres, l'arithmétique, le calcul littéral et les équations, puis la notion de fonction, sa courbe, ses variations et les fonctions de référence."
      en: "The first year of lycée in mathematics: the vocabulary of logic, number sets, arithmetic, algebraic manipulation and equations, then the notion of function, its curve, its variations and the reference functions."
    nodes:
      - concept.logic_sets
      - concept.number_sets
      - tool.arithmetic
      - tool.powers_roots
      - tool.algebraic_identities
      - tool.linear_equations
      - tool.sign_table
      - concept.function
      - concept.graph
      - concept.variations_extremums
      - tool.reference_functions
  - id: route.seconde.geometry_data
    kind: thematic
    stage: seconde
    title:
      fr: "Seconde : géométrie, statistiques et probabilités"
      en: "Grade 10: geometry, statistics and probability"
    summary:
      fr: "Les vecteurs et le repérage, les équations de droites, puis l'information chiffrée, les statistiques descriptives, les probabilités, l'échantillonnage et un premier contact avec l'algorithmique."
      en: "Vectors and coordinates, equations of lines, then percentages, descriptive statistics, probability, sampling and a first contact with algorithmics."
    nodes:
      - tool.vector
      - concept.coordinates
      - tool.line_equations
      - concept.proportions_evolutions
      - tool.descriptive_statistics
      - concept.probability
      - concept.sampling_fluctuation
      - tool.algorithmics
  - id: route.seconde.motion_waves
    kind: thematic
    stage: seconde
    title:
      fr: "Seconde : mouvement, interactions, ondes et signaux"
      en: "Grade 10: motion, interactions, waves and signals"
    summary:
      fr: "Les unités et la mesure, la description d'un mouvement, les forces, le principe d'inertie et la gravitation, puis le son, la réfraction, les lentilles et la loi d'Ohm."
      en: "Units and measurement, describing a motion, forces, the principle of inertia and gravitation, then sound, refraction, lenses and Ohm's law."
    nodes:
      - concept.dimension_unit
      - method.measurement
      - model.kinematics_point
      - concept.force
      - law.inertia
      - law.universal_gravitation
      - phenomenon.sound
      - law.snell_descartes
      - model.thin_lens
      - law.ohm
  - id: route.seconde.matter
    kind: thematic
    stage: seconde
    title:
      fr: "Seconde : constitution et transformations de la matière"
      en: "Grade 10: constitution and transformations of matter"
    summary:
      fr: "Corps purs, mélanges et solutions, l'atome et le tableau périodique, la mole, puis les trois transformations de la matière : physique, chimique et nucléaire."
      en: "Pure substances, mixtures and solutions, the atom and the periodic table, the mole, then the three transformations of matter: physical, chemical and nuclear."
    nodes:
      - concept.pure_substances_mixtures
      - concept.concentration
      - model.atom
      - model.periodic_table
      - concept.amount_of_substance
      - phenomenon.state_changes
      - model.chemical_reaction
      - phenomenon.nuclear_transformation
  - id: route.premiere.analysis
    kind: recommended
    stage: premiere
    title:
      fr: "Première : suites, second degré, dérivée, exponentielle, trigonométrie"
      en: "Grade 11: sequences, quadratics, derivative, exponential, trigonometry"
    summary:
      fr: "Le parcours conseillé de Première en analyse : les suites et leurs deux modèles, le second degré, le taux de variation et la dérivée, les variations, l'exponentielle et le cercle trigonométrique."
      en: "The recommended Grade 11 path in analysis: sequences and their two models, quadratics, the rate of change and the derivative, variations, the exponential and the unit circle."
    nodes:
      - concept.sequence
      - tool.arithmetic_geometric_sequences
      - tool.quadratic
      - concept.rate_of_change
      - tool.derivative
      - concept.variations_extremums
      - tool.exponential
      - tool.trigonometric_functions
  - id: route.premiere.geometry_probability
    kind: thematic
    stage: premiere
    title:
      fr: "Première : produit scalaire, géométrie repérée, probabilités conditionnelles"
      en: "Grade 11: dot product, coordinate geometry, conditional probability"
    summary:
      fr: "Le produit scalaire et ses usages, les droites et les cercles par leurs équations, puis les probabilités conditionnelles, les variables aléatoires, les listes en programmation et les raisonnements."
      en: "The dot product and its uses, lines and circles through their equations, then conditional probability, random variables, lists in programming and reasoning."
    nodes:
      - tool.dot_product
      - tool.analytic_geometry
      - concept.conditional_probability
      - concept.random_variable
      - tool.algorithmics
      - concept.logic_sets
  - id: route.premiere.mechanics_energy
    kind: thematic
    stage: premiere
    title:
      fr: "Première : mesure, mouvement, champs, énergie, ondes et lumière"
      en: "Grade 11: measurement, motion, fields, energy, waves and light"
    summary:
      fr: "Mesurer avec une incertitude, décrire un mouvement par ses vecteurs vitesse, lire les forces dans la variation de vitesse, les interactions et les champs, un fluide au repos, les énergies mécanique et électrique, les ondes, les couleurs, la lentille et le photon."
      en: "Measuring with an uncertainty, describing a motion by its velocity vectors, reading the forces in the change of velocity, interactions and fields, a fluid at rest, mechanical and electrical energies, waves, colours, the lens and the photon."
    nodes:
      - method.measurement
      - model.kinematics_point
      - law.newton_second
      - law.coulomb
      - concept.field
      - law.fluid_statics
      - concept.kinetic_energy_work
      - concept.mechanical_energy
      - concept.electrical_power
      - phenomenon.mechanical_wave
      - phenomenon.colour
      - model.thin_lens
      - model.photon
  - id: route.premiere.matter
    kind: thematic
    stage: premiere
    title:
      fr: "Première : transformations de la matière, entités chimiques, synthèses"
      en: "Grade 11: transformations of matter, chemical entities, syntheses"
    summary:
      fr: "Suivre une transformation par son avancement, doser une espèce, échanger des électrons, dessiner les molécules et leurs groupes, comprendre la cohésion et la dissolution, lire un spectre infrarouge, synthétiser et brûler."
      en: "Following a transformation through its extent, titrating a species, exchanging electrons, drawing molecules and their groups, understanding cohesion and dissolution, reading an infrared spectrum, synthesising and burning."
    nodes:
      - model.chemical_reaction
      - concept.concentration
      - method.titration
      - model.redox
      - model.lewis_structure
      - concept.cohesion_dissolution
      - model.organic_molecules
      - method.ir_spectroscopy
      - method.organic_synthesis
      - phenomenon.combustion
  - id: route.terminale.analysis
    kind: recommended
    stage: terminale
    title:
      fr: "Terminale : limites, continuité, logarithme, intégrale"
      en: "Grade 12: limits, continuity, logarithm, integral"
    summary:
      fr: "Le parcours conseillé de Terminale en analyse : les limites d'une suite et d'une fonction, la continuité et le théorème des valeurs intermédiaires, le logarithme népérien, puis le calcul intégral comme aire et comme primitive."
      en: "The recommended Grade 12 path in analysis: the limits of a sequence and of a function, continuity and the intermediate value theorem, the natural logarithm, then integral calculus as an area and as an antiderivative."
    nodes:
      - concept.sequence_limit
      - concept.limit
      - concept.continuity
      - tool.logarithm
      - tool.integral
  - id: route.terminale.geometry_probability
    kind: thematic
    stage: terminale
    title:
      fr: "Terminale : géométrie dans l'espace, dénombrement, loi binomiale"
      en: "Grade 12: geometry in space, counting, binomial law"
    summary:
      fr: "Les vecteurs, droites et plans de l'espace avec le produit scalaire, puis le dénombrement, la loi binomiale, la somme de variables aléatoires et la loi des grands nombres."
      en: "Vectors, lines and planes in space with the dot product, then counting, the binomial law, the sum of random variables and the law of large numbers."
    nodes:
      - tool.space_geometry
      - tool.counting
      - concept.binomial_law
      - concept.random_variable_sum
      - concept.law_of_large_numbers
  - id: route.terminale.motion_energy
    kind: thematic
    stage: terminale
    title:
      fr: "Terminale : mouvements, gravitation, oscillateur, énergie"
      en: "Grade 12: motions, gravitation, oscillator, energy"
    summary:
      fr: "Le mouvement circulaire et son accélération centripète, les lois de Kepler et les satellites, l'oscillateur mécanique et sa période propre, puis le premier principe et les transferts thermiques."
      en: "Circular motion and its centripetal acceleration, Kepler's laws and satellites, the mechanical oscillator and its natural period, then the first principle and thermal transfers."
    nodes:
      - phenomenon.circular_motion
      - model.gravitational_motion
      - phenomenon.oscillator
      - law.first_principle
      - phenomenon.thermal_transfer
  - id: route.terminale.waves_light
    kind: thematic
    stage: terminale
    title:
      fr: "Terminale : intensité sonore, diffraction, Doppler, lunette"
      en: "Grade 12: sound level, diffraction, Doppler, telescope"
    summary:
      fr: "Le niveau d'intensité sonore et son échelle logarithmique, la diffraction et les interférences de la lumière, l'effet Doppler, et la lunette astronomique qui grossit les angles."
      en: "The sound intensity level and its logarithmic scale, the diffraction and interference of light, the Doppler effect, and the astronomical telescope that magnifies angles."
    nodes:
      - concept.sound_level
      - phenomenon.interference
      - phenomenon.doppler
      - model.telescope
  - id: route.terminale.matter
    kind: thematic
    stage: terminale
    title:
      fr: "Terminale : acides et bases, équilibres, piles, cinétique, synthèse"
      en: "Grade 12: acids and bases, equilibria, cells, kinetics, synthesis"
    summary:
      fr: "Le pH et les domaines de prédominance, le quotient de réaction et l'équilibre, le titrage suivi par pH-métrie, les piles et l'évolution spontanée, la vitesse d'une réaction, puis la stratégie de synthèse et l'analyse instrumentale."
      en: "The pH and the predominance domains, the reaction quotient and equilibrium, the titration followed by pH, cells and spontaneous evolution, the rate of a reaction, then the strategy of a synthesis and instrumental analysis."
    nodes:
      - model.acid_base
      - concept.chemical_equilibrium
      - method.titration
      - model.electrochemical_cell
      - concept.reaction_rate
      - method.synthesis_strategy
      - method.instrumental_analysis
  - id: route.first_journey
    kind: recommended
    stage: terminale
    title:
      fr: "Premier voyage : de la fonction à la dérivée"
      en: "First journey: from function to derivative"
    summary:
      fr: "Le parcours conseillé pour une première session : de la fonction et de sa courbe au taux de variation, puis à la dérivée, l'outil central du voyage."
      en: "The recommended path for a first session: from the function and its graph to the rate of change, then to the derivative, the central tool of the journey."
    nodes:
      - concept.function
      - concept.graph
      - concept.rate_of_change
      - tool.derivative
      - mission.galileo.inclined_plane
  - id: route.motion
    kind: thematic
    stage: terminale
    title:
      fr: "Décrire et prédire le mouvement"
      en: "Describing and predicting motion"
    summary:
      fr: "Une question, les outils de la mesure et de la modélisation, puis la cinématique et la deuxième loi de Newton : de quoi décrire un mouvement, le prédire, et retrouver le plan incliné et la chute libre."
      en: "A question, the tools of measurement and modelling, then kinematics and Newton's second law: enough to describe a motion, predict it, and recover the inclined plane and free fall."
    nodes:
      - question.how_to_predict_motion
      - concept.dimension_unit
      - method.measurement
      - method.modelling
      - tool.vector
      - model.kinematics_point
      - law.newton_second
      - phenomenon.motion.uniformly_accelerated
      - phenomenon.motion.inclined_plane
      - phenomenon.motion.free_fall
  - id: route.galileo_history
    kind: historical
    stage: terminale
    title:
      fr: "Galilée à Padoue"
      en: "Galileo in Padua"
    summary:
      fr: "Le temps, les lieux, l'homme et son correspondant : l'époque où le mouvement a été mesuré avant d'être expliqué."
      en: "The time, the places, the man and his correspondent: the era when motion was measured before it was explained."
    nodes:
      - period.galileo_padua_1592_1610
      - place.padua
      - place.pisa
      - person.galileo_galilei
      - person.paolo_sarpi
      - mission.galileo.inclined_plane
  - id: route.exponential_everywhere
    kind: thematic
    stage: terminale
    title:
      fr: "L'exponentielle est partout"
      en: "The exponential is everywhere"
    summary:
      fr: "Une seule équation pour trois mondes : l'exponentielle, la condition initiale et l'équation différentielle, puis le schéma « vitesse proportionnelle à la quantité restante » retrouvé dans un circuit, une réaction, un noyau et une chute freinée."
      en: "One equation for three worlds: the exponential, the initial condition and the differential equation, then the pattern \"rate proportional to the remaining quantity\" found again in a circuit, a reaction, a nucleus and a braked fall."
    nodes:
      - tool.exponential
      - concept.initial_condition
      - tool.ode_first_order
      - concept.rate_proportional_to_quantity
      - model.rc_circuit
      - phenomenon.circuit.capacitor_charging
      - phenomenon.chemistry.concentration_over_time
      - model.reaction_order_one
      - phenomenon.chemistry.first_order_reaction
      - phenomenon.nuclear.radioactive_decay
      - phenomenon.motion.with_drag

# Guided flights ("bird's-eye"): an ordered sequence of legs flown over automatically. A leg is an
# authored route, or an automatic group collecting the lessons of the learner's horizon not yet
# covered by an earlier leg (one world, the remaining history nodes, or the bridges). Every leg after
# the first carries the sentence that links the previous leg to this one; write it so that it still
# makes sense when the previous leg was skipped because everything in it was already practised.
# The flight follows the prerequisites: the compiler refuses a flight where an essential
# prerequisite is flown after a destination that needs it.
tours:
  - id: tour.horizon_flight
    title: { fr: "Vol d'oiseau", en: "Bird's-eye flight" }
    intro:
      fr: >-
        Bienvenue à bord. Ce vol survole tout ce qu'il vous reste à voir d'ici les concours, dans l'ordre où les notions se construisent : chaque escale vient après celles dont elle dépend. D'abord les routes conseillées, puis ce qui reste dans chaque monde. À chaque escale, une courte présentation ; vous pourrez ouvrir la leçon complète plus tard.
      en: >-
        Welcome aboard. This flight passes over everything you still have to see before the entrance exams, in the order in which the notions build on one another: each stop comes after the ones it depends on. First the recommended routes, then what remains in each world. A short presentation at each stop; you can open the full lesson later.
    legs:
      - route: route.seconde.numbers_functions
      - route: route.seconde.geometry_data
        transition:
          fr: >-
            Les nombres, les équations et les fonctions sont en place. Passons à la géométrie du plan, aux vecteurs et aux droites, puis aux données : statistiques, probabilités et échantillonnage.
          en: >-
            Numbers, equations and functions are in place. Let us move on to plane geometry, vectors and lines, then to data: statistics, probability and sampling.
      - route: route.seconde.motion_waves
        transition:
          fr: >-
            Les outils mathématiques de Seconde sont posés. Passons à la physique : mesurer, décrire un mouvement, modéliser les actions par des forces, puis suivre les ondes, le son et la lumière, jusqu'aux circuits.
          en: >-
            The mathematical tools of Grade 10 are laid down. On to physics: measuring, describing a motion, modelling actions by forces, then following waves, sound and light, down to circuits.
      - route: route.seconde.matter
        transition:
          fr: >-
            Du mouvement à la matière : de quoi elle est faite, comment on la décrit et comment elle se transforme, par des changements d'état, des réactions chimiques et des transformations nucléaires.
          en: >-
            From motion to matter: what it is made of, how it is described and how it transforms, through changes of state, chemical reactions and nuclear transformations.
      - route: route.premiere.analysis
        transition:
          fr: >-
            La Seconde est derrière nous. La Première commence par l'analyse : les suites, le second degré, puis le taux de variation et la dérivée, les variations, l'exponentielle et le cercle trigonométrique.
          en: >-
            Grade 10 is behind us. Grade 11 starts with analysis: sequences, quadratics, then the rate of change and the derivative, variations, the exponential and the unit circle.
      - route: route.premiere.geometry_probability
        transition:
          fr: >-
            Les fonctions de Première sont en place. Passons au produit scalaire et à la géométrie repérée, puis aux probabilités conditionnelles et aux variables aléatoires, avec les listes en programmation et les raisonnements.
          en: >-
            The Grade 11 functions are in place. On to the dot product and coordinate geometry, then conditional probability and random variables, with lists in programming and reasoning.
      - route: route.premiere.mechanics_energy
        transition:
          fr: >-
            Les outils mathématiques de Première sont posés. En physique : mesurer avec une incertitude, décrire un mouvement par ses vecteurs vitesse, lire les forces dans la variation de vitesse, puis les champs, l'énergie, les ondes et la lumière.
          en: >-
            The Grade 11 mathematical tools are laid down. In physics: measuring with an uncertainty, describing a motion by its velocity vectors, reading the forces in the change of velocity, then fields, energy, waves and light.
      - route: route.premiere.matter
        transition:
          fr: >-
            Du mouvement et de l'énergie à la matière : suivre une transformation par son avancement, doser, échanger des électrons, dessiner les molécules et les synthétiser, jusqu'aux combustions.
          en: >-
            From motion and energy to matter: following a transformation through its extent, titrating, exchanging electrons, drawing molecules and synthesising them, down to combustions.
      - route: route.terminale.analysis
        transition:
          fr: >-
            La Première est derrière nous. La Terminale commence par l'analyse : ce qui se passe quand on s'approche de l'infini ou d'un point interdit, la continuité qui garantit qu'une solution existe, le logarithme qui défait l'exponentielle, et l'intégrale qui mesure une aire.
          en: >-
            Grade 11 is behind us. Grade 12 starts with analysis: what happens on approaching infinity or a forbidden point, the continuity that guarantees a solution exists, the logarithm that undoes the exponential, and the integral that measures an area.
      - route: route.terminale.geometry_probability
        transition:
          fr: >-
            L'analyse de Terminale est en place. Sortons du plan : les vecteurs, les droites et les plans de l'espace, avec le produit scalaire pour mesurer les angles et les distances ; puis le dénombrement, la loi binomiale et la loi des grands nombres.
          en: >-
            The Grade 12 analysis is in place. Let us leave the plane: vectors, lines and planes in space, with the dot product to measure angles and distances; then counting, the binomial law and the law of large numbers.
      - route: route.terminale.motion_energy
        transition:
          fr: >-
            Ces outils servent tout de suite en physique : le mouvement circulaire et son accélération dirigée vers le centre, les orbites et les lois de Kepler, l'oscillateur et sa période propre, puis les bilans d'énergie et les transferts thermiques.
          en: >-
            These tools serve at once in physics: circular motion and its acceleration pointed at the centre, orbits and Kepler's laws, the oscillator and its natural period, then energy balances and thermal transfers.
      - route: route.terminale.waves_light
        transition:
          fr: >-
            Du mouvement aux ondes : l'échelle logarithmique du niveau sonore, la lumière qui s'étale derrière une fente et se superpose à elle-même, le son qui monte quand la source approche, et la lunette qui grossit les angles.
          en: >-
            From motion to waves: the logarithmic scale of the sound level, light spreading behind a slit and superposing on itself, the pitch that rises as the source closes in, and the telescope that magnifies angles.
      - route: route.terminale.matter
        transition:
          fr: >-
            Reste la matière : le pH et les domaines de prédominance, l'équilibre chimique où la réaction s'arrête avant la fin, le titrage suivi par pH-métrie, les piles qui font circuler les électrons, la vitesse des réactions et la stratégie d'une synthèse.
          en: >-
            Matter remains: the pH and the predominance domains, the chemical equilibrium where the reaction stops before the end, the titration followed by pH, the cells that make electrons flow, the rate of reactions and the strategy of a synthesis.
      - route: route.first_journey
        transition:
          fr: >-
            Revenons au cœur du programme, là où tout se rejoint : la fonction et sa courbe relues avec les limites, le taux de variation, et la dérivée approfondie — fonction composée, dérivée seconde, convexité — qui sert dans toutes les autres routes.
          en: >-
            Back to the heart of the programme, where everything meets: the function and its graph reread with limits, the rate of change, and the derivative deepened — composite function, second derivative, convexity — which serves in every other route.
      - route: route.motion
        transition:
          fr: >-
            La dérivée est forgée. Voyons ce qu'elle permet en physique : d'abord décrire un mouvement, position, vitesse, accélération, puis le prédire avec la deuxième loi de Newton.
          en: >-
            The derivative is forged. Let us see what it makes possible in physics: first describing a motion, position, velocity, acceleration, then predicting it with Newton's second law.
      - route: route.galileo_history
        transition:
          fr: >-
            Ces lois ont une histoire. Remontons le temps jusqu'à Padoue, vers mille six cent quatre, pour rencontrer l'homme, les lieux et l'époque où le mouvement a été mesuré avant d'être expliqué.
          en: >-
            These laws have a history. Let us go back in time to Padua, around sixteen hundred and four, to meet the man, the places and the era when motion was measured before it was explained.
      - route: route.exponential_everywhere
        transition:
          fr: >-
            Galilée a montré comment une loi sort d'une mesure. La route suivante montre comment une seule loi traverse trois mondes : partout où la vitesse est proportionnelle à ce qui reste, l'exponentielle apparaît.
          en: >-
            Galileo showed how a law comes out of a measurement. The next route shows how a single law crosses three worlds: wherever the rate is proportional to what remains, the exponential appears.
      - world: world.mathematics
        title: { fr: "Ce qui reste en mathématiques", en: "What remains in mathematics" }
        transition:
          fr: >-
            Les routes conseillées sont derrière nous. Cap maintenant sur les destinations restantes, monde par monde, en commençant par les mathématiques.
          en: >-
            The recommended routes are behind us. Heading now for the remaining destinations, world by world, starting with mathematics.
      - world: world.physics
        title: { fr: "Ce qui reste en physique", en: "What remains in physics" }
        transition:
          fr: >-
            Les outils mathématiques restants sont repérés. Traversons vers la physique, où ils servent à décrire et à prédire le mouvement.
          en: >-
            The remaining mathematical tools are located. Let us cross over to physics, where they serve to describe and predict motion.
      - world: world.chemistry
        title: { fr: "Ce qui reste en chimie", en: "What remains in chemistry" }
        transition:
          fr: >-
            De la physique à la chimie, la même dérivée change de nom : elle devient vitesse de réaction. Voici ce qui reste à voir dans le monde de la chimie.
          en: >-
            From physics to chemistry, the same derivative changes its name: it becomes the rate of reaction. Here is what remains to be seen in the world of chemistry.
      - history: true
        title: { fr: "Les acteurs et les lieux restants", en: "The remaining people and places" }
        transition:
          fr: >-
            Avant les ponts, un détour par l'histoire : les personnes, les lieux et les époques qu'aucune route n'a encore visités.
          en: >-
            Before the bridges, a detour through history: the people, places and periods no route has visited yet.
      - bridges: true
        title: { fr: "Les ponts entre les mondes", en: "The bridges between worlds" }
        transition:
          fr: >-
            Pour finir, les ponts : les méthodes et les idées que les trois mondes partagent, mesure, modélisation, conditions initiales.
          en: >-
            Finally, the bridges: the methods and ideas shared by the three worlds, measurement, modelling, initial conditions.
    outro:
      fr: >-
        Fin du survol. Vous avez maintenant une vue d'ensemble de votre horizon, dans l'ordre où les notions se construisent. Choisissez une destination et ouvrez sa leçon : la carte vous montrera ce qu'elle demande et ce qu'elle ouvre.
      en: >-
        End of the flight. You now have an overview of your horizon, in the order in which the notions build on one another. Choose a destination and open its lesson: the map will show you what it requires and what it opens.
