# Leçon taux de variation — une vitesse moyenne (réponse numérique avec unité)
id: exercise.rate.speed
type: numeric
nodeId: concept.rate_of_change
phenomenonId: phenomenon.motion.uniformly_accelerated
depth: 1
evidenceDimension: modelling_choice
prompt:
  fr: |-
    Un mobile a pour loi horaire $x(t) = 3t^2$ ($x$ en mètres, $t$ en secondes).

    Quelle est sa vitesse moyenne entre $t = 1\ \mathrm{s}$ et $t = 2\ \mathrm{s}$ ?
  en: |-
    A moving body has the position law $x(t) = 3t^2$ ($x$ in metres, $t$ in seconds).

    What is its average speed between $t = 1\ \mathrm{s}$ and $t = 2\ \mathrm{s}$?
numeric:
  value: 9
  unit: "m/s"
  tolerance: { kind: absolute, value: 0.05 }
  inputLabel: { fr: "Vitesse moyenne", en: "Average speed" }
hints:
  - id: h1
    autonomy: 0.8
    text:
      fr: |-
        La vitesse moyenne est un taux de variation : distance parcourue divisée par la durée.
      en: |-
        The average speed is a rate of change: distance covered divided by the duration.
  - id: h2
    autonomy: 0.6
    text:
      fr: |-
        $x(2) = 12\ \mathrm{m}$ et $x(1) = 3\ \mathrm{m}$, sur une durée de $1\ \mathrm{s}$.
      en: |-
        $x(2) = 12\ \mathrm{m}$ and $x(1) = 3\ \mathrm{m}$, over a duration of $1\ \mathrm{s}$.
solution:
  fr: |-
    $$v_{\text{moy}} = \frac{x(2) - x(1)}{2 - 1} = \frac{12 - 3}{1} = 9\ \mathrm{m/s}.$$
    Cette vitesse moyenne ne dit pas la vitesse à l'instant $t = 1\ \mathrm{s}$ (qui vaut $6\ \mathrm{m/s}$) ni à $t = 2\ \mathrm{s}$ ($12\ \mathrm{m/s}$) : pour cela, il faut la dérivée.
  en: |-
    $$v_{\text{avg}} = \frac{x(2) - x(1)}{2 - 1} = \frac{12 - 3}{1} = 9\ \mathrm{m/s}.$$
    This average speed says nothing about the speed at the instant $t = 1\ \mathrm{s}$ (which is $6\ \mathrm{m/s}$) nor at $t = 2\ \mathrm{s}$ ($12\ \mathrm{m/s}$): for that, the derivative is needed.
difficulty:
  mathematicalDepth: 1
  conceptualNovelty: 2
  calculationLength: 1
  modellingOpenness: 2
  linkedConcepts: 2
  transfer: 2
  autonomy: 2
