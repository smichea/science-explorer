# Leçon fonction — calculer une image (réponse numérique)
id: exercise.function.image
type: numeric
nodeId: concept.function
depth: 1
evidenceDimension: procedural_execution
prompt:
  fr: |-
    Soit la fonction $g$ définie sur $\mathbb{R}$ par $g(x) = 3x^2 + 1$.

    Calculez l'image de $2$ par $g$.
  en: |-
    Let $g$ be the function defined on $\mathbb{R}$ by $g(x) = 3x^2 + 1$.

    Compute the image of $2$ under $g$.
numeric:
  value: 13
  tolerance: { kind: absolute, value: 0.001 }
  inputLabel: { fr: "g(2)", en: "g(2)" }
hints:
  - id: h1
    autonomy: 0.8
    text:
      fr: |-
        Remplacez $x$ par $2$ dans la formule : $g(2) = 3 \times 2^2 + 1$.
      en: |-
        Replace $x$ with $2$ in the formula: $g(2) = 3 \times 2^2 + 1$.
  - id: h2
    autonomy: 0.6
    text:
      fr: |-
        $2^2 = 4$, puis $3 \times 4 = 12$ ; il reste à ajouter $1$.
      en: |-
        $2^2 = 4$, then $3 \times 4 = 12$; it remains to add $1$.
solution:
  fr: |-
    $$g(2) = 3 \times 2^2 + 1 = 3 \times 4 + 1 = 13.$$
    Sur la courbe de $g$, le point d'abscisse $2$ a pour ordonnée $13$ : lire une image, c'est monter de l'axe des abscisses jusqu'à la courbe, puis lire l'ordonnée.
  en: |-
    $$g(2) = 3 \times 2^2 + 1 = 3 \times 4 + 1 = 13.$$
    On the curve of $g$, the point with abscissa $2$ has ordinate $13$: reading an image means going up from the horizontal axis to the curve, then reading the ordinate.
difficulty:
  mathematicalDepth: 1
  conceptualNovelty: 1
  calculationLength: 1
  modellingOpenness: 1
  linkedConcepts: 1
  transfer: 1
  autonomy: 2
