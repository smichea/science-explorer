id: exercise.lambda.path_cost
nodeId: concept.lambda_reduction_paths
depth: 1
type: numeric
evidenceDimension: procedural_execution
prompt:
  fr: 'Avec $I=\lambda x.x$ et $D=\lambda x.x\,x$, combien de pas faut-il pour atteindre I depuis $D\,(I\,I)$ si l’on commence par réduire l’argument ?'
  en: 'With $I=\lambda x.x$ and $D=\lambda x.x\,x$, how many steps reach I from $D\,(I\,I)$ if the argument is reduced first?'
numeric:
  value: 3
  tolerance: { kind: absolute, value: 0 }
solution:
  fr: '$D\,(I\,I)\to D\,I\to I\,I\to I$ : trois flèches, donc trois pas. Réduire d’abord l’application extérieure recopie le calcul I I et donne un chemin de quatre pas. Développer les abréviations I et D ne compte pas comme une bêta-réduction.'
  en: '$D\,(I\,I)\to D\,I\to I\,I\to I$: three arrows, hence three steps. Reducing the outer application first copies the computation I I and gives a four-step path. Expanding the abbreviations I and D does not count as beta reduction.'
difficulty: { mathematicalDepth: 1, conceptualNovelty: 2, calculationLength: 2, modellingOpenness: 1, linkedConcepts: 2, transfer: 1, autonomy: 2 }
