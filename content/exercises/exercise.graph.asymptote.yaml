# Courbe représentative en Terminale — lire une asymptote horizontale sur une expression.
id: exercise.graph.asymptote
type: numeric
nodeId: concept.graph
depth: 2
evidenceDimension: recognition_explanation
prompt:
  fr: |-
    On étudie la fonction $g$ définie sur $]1\,;\,+\infty[$ par $g(x) = \dfrac{3x - 5}{x - 1}$.

    Sa courbe admet une asymptote horizontale d'équation $y = \ell$ en $+\infty$. Que vaut $\ell$ ?
  en: |-
    Consider the function $g$ defined on $]1, +\infty[$ by $g(x) = \dfrac{3x - 5}{x - 1}$.

    Its curve has a horizontal asymptote of equation $y = \ell$ at $+\infty$. What is $\ell$?
numeric:
  value: 3
  tolerance: { kind: absolute, value: 0.01 }
  inputLabel: { fr: "ℓ", en: "ℓ" }
hints:
  - id: h1
    autonomy: 0.8
    text:
      fr: |-
        Quand $x$ devient très grand, le $-5$ du numérateur et le $-1$ du dénominateur pèsent de moins en moins devant $3x$ et $x$.
      en: |-
        When $x$ becomes very large, the $-5$ of the numerator and the $-1$ of the denominator weigh less and less against $3x$ and $x$.
  - id: h2
    autonomy: 0.6
    text:
      fr: |-
        Mettez $x$ en facteur en haut et en bas : $g(x) = \dfrac{x(3 - 5/x)}{x(1 - 1/x)}$, puis simplifiez.
      en: |-
        Factor $x$ out top and bottom: $g(x) = \dfrac{x(3 - 5/x)}{x(1 - 1/x)}$, then simplify.
solution:
  fr: |-
    En factorisant par $x$ : $g(x) = \dfrac{x\left(3 - \dfrac{5}{x}\right)}{x\left(1 - \dfrac{1}{x}\right)} = \dfrac{3 - \dfrac{5}{x}}{1 - \dfrac{1}{x}}$. Quand $x \to +\infty$, $\dfrac{5}{x} \to 0$ et $\dfrac{1}{x} \to 0$, donc $g(x) \to \dfrac{3}{1} = 3$ : la droite d'équation $y = 3$ est asymptote horizontale, et $\ell = 3$.

    Un contrôle numérique rassure : $g(100) = \dfrac{295}{99} \approx 2{,}98$ et $g(10^4) \approx 2{,}9998$.

    **Interprétation.** Pour un quotient de deux polynômes de même degré, la limite en l'infini est le **quotient des coefficients dominants** : ici $3/1 = 3$. L'asymptote n'interdit rien : la courbe reste ici en dessous de $y = 3$ puisque $g(x) - 3 = \dfrac{-2}{x - 1} < 0$, et elle s'en approche autant qu'on veut sans jamais la toucher. C'est la même idée que la tension d'un condensateur qui monte vers $E$ sans l'atteindre.
  en: |-
    Factoring by $x$: $g(x) = \dfrac{x\left(3 - \dfrac{5}{x}\right)}{x\left(1 - \dfrac{1}{x}\right)} = \dfrac{3 - \dfrac{5}{x}}{1 - \dfrac{1}{x}}$. When $x \to +\infty$, $\dfrac{5}{x} \to 0$ and $\dfrac{1}{x} \to 0$, so $g(x) \to \dfrac{3}{1} = 3$: the line of equation $y = 3$ is a horizontal asymptote, and $\ell = 3$.

    A numerical check reassures: $g(100) = \dfrac{295}{99} \approx 2.98$ and $g(10^4) \approx 2.9998$.

    **Interpretation.** For a quotient of two polynomials of the same degree, the limit at infinity is the **quotient of the leading coefficients**: here $3/1 = 3$. The asymptote forbids nothing: the curve stays below $y = 3$ here since $g(x) - 3 = \dfrac{-2}{x - 1} < 0$, and it comes as close to it as we please without ever touching it. It is the same idea as the voltage of a capacitor rising towards $E$ without reaching it.
