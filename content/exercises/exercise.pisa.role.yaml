solution:
  fr: Galilée naît à Pise en 1564 et y enseigne de 1589 à 1592. L'expérience de la tour de Pise est disputée par les historiens ; les mesures sur plan incliné sont padouanes.
  en: Galileo is born in Pisa in 1564 and teaches there from 1589 to 1592. The Leaning Tower experiment is disputed by historians; the inclined-plane measurements are Paduan.
