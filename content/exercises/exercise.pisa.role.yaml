prompt:
  fr: Que représente Pise pour Galilée ?
  en: What does Pisa represent for Galileo?
choice:
  multiple: false
  choices:
  - id: birth_first
    text:
      fr: Sa ville natale et son premier poste d'enseignant (1589–1592).
      en: His birthplace and his first teaching post (1589–1592).
    correct: true
  - id: plane
    text:
      fr: La ville des expériences du plan incliné.
