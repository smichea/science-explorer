solution:
  fr: 'Padoue est la ville de la chaire de Galilée (1592–1610), dans la République de Venise : les expériences du plan incliné y sont menées vers 1604–1608. Il est né à Pise ; les Discorsi sont imprimés à Leyde.'
  en: 'Padua is the city of Galileo''s chair (1592–1610), in the Republic of Venice: the inclined-plane experiments are carried out there around 1604–1608. He was born in Pisa; the Discorsi are printed in Leiden.'
