# Géométrie dans l'espace en Terminale — valeur du paramètre rendant deux vecteurs orthogonaux
id: exercise.space.orthogonality
type: numeric
nodeId: tool.space_geometry
depth: 1
evidenceDimension: procedural_execution
prompt:
  fr: |-
    Dans un repère orthonormé de l'espace, on considère les vecteurs $\vec u\,(2\,;\,-1\,;\,3)$ et $\vec v\,(1\,;\,4\,;\,k)$, où $k$ est un réel.

    Pour quelle valeur de $k$ les vecteurs $\vec u$ et $\vec v$ sont-ils orthogonaux ?
  en: |-
    In an orthonormal frame of space, consider the vectors $\vec u\,(2\,;\,-1\,;\,3)$ and $\vec v\,(1\,;\,4\,;\,k)$, where $k$ is a real number.

    For which value of $k$ are the vectors $\vec u$ and $\vec v$ orthogonal?
numeric:
  value: 0.6667
  tolerance: { kind: absolute, value: 0.01 }
  inputLabel: { fr: "valeur de $k$", en: "value of $k$" }
hints:
  - id: h1
    autonomy: 0.8
    text:
      fr: |-
        Deux vecteurs sont orthogonaux si et seulement si leur produit scalaire est nul.
      en: |-
        Two vectors are orthogonal if and only if their dot product vanishes.
  - id: h2
    autonomy: 0.6
    text:
      fr: |-
        Dans un repère orthonormé, $\vec u \cdot \vec v = xx' + yy' + zz'$ : écrivez $2 \times 1 + (-1) \times 4 + 3k = 0$.
      en: |-
        In an orthonormal frame, $\vec u \cdot \vec v = xx' + yy' + zz'$: write $2 \times 1 + (-1) \times 4 + 3k = 0$.
solution:
  fr: |-
    Le produit scalaire vaut $\vec u \cdot \vec v = 2 \times 1 + (-1) \times 4 + 3 \times k = 2 - 4 + 3k = 3k - 2$. Les vecteurs sont orthogonaux si et seulement si ce produit est nul :
    $$3k - 2 = 0 \quad\Longleftrightarrow\quad k = \frac23 \approx 0{,}667.$$
    Pour cette valeur, $\vec v\left(1\,;\,4\,;\,\frac23\right)$ est perpendiculaire à $\vec u$, et l'angle entre les deux vecteurs vaut exactement $90^{\circ}$.

    **Interprétation.** Le produit scalaire de l'espace se calcule exactement comme celui du plan, avec une coordonnée de plus : rien de nouveau n'a été inventé, la formule a simplement été prolongée. C'est ce test d'orthogonalité qui sert ensuite à tout : reconnaître un vecteur normal à un plan, vérifier qu'une droite est perpendiculaire à un plan, calculer une distance. Une seule équation à une inconnue suffit ici, parce que l'orthogonalité est une condition, pas une direction imposée : il reste tout un plan de vecteurs orthogonaux à $\vec u$.
  en: |-
    The dot product is $\vec u \cdot \vec v = 2 \times 1 + (-1) \times 4 + 3 \times k = 2 - 4 + 3k = 3k - 2$. The vectors are orthogonal if and only if this product vanishes:
    $$3k - 2 = 0 \quad\Longleftrightarrow\quad k = \frac23 \approx 0.667.$$
    For this value, $\vec v\left(1\,;\,4\,;\,\frac23\right)$ is perpendicular to $\vec u$, and the angle between the two vectors is exactly $90^{\circ}$.

    **Interpretation.** The dot product in space is computed exactly like the one in the plane, with one coordinate more: nothing new has been invented, the formula has simply been extended. It is this orthogonality test that then serves for everything: recognising a vector normal to a plane, checking that a line is perpendicular to a plane, computing a distance. A single equation in one unknown is enough here, because orthogonality is a condition, not an imposed direction: a whole plane of vectors orthogonal to $\vec u$ remains.
