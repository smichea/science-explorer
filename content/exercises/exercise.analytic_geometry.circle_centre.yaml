# Géométrie repérée — retrouver le rayon d'un cercle donné par une équation développée (réponse numérique)
id: exercise.analytic_geometry.circle_centre
type: numeric
nodeId: tool.analytic_geometry
depth: 1
evidenceDimension: procedural_execution
prompt:
  fr: |-
    Dans un repère orthonormé, l'ensemble $\mathcal{C}$ est formé des points $M(x\,;\,y)$ vérifiant
    $$x^2 + y^2 - 2x + 4y - 4 = 0.$$

    Montrez que $\mathcal{C}$ est un cercle, puis donnez son **rayon**.
  en: |-
    In an orthonormal frame, the set $\mathcal{C}$ consists of the points $M(x\,;\,y)$ satisfying
    $$x^2 + y^2 - 2x + 4y - 4 = 0.$$

    Show that $\mathcal{C}$ is a circle, then give its **radius**.
numeric:
  value: 3
  tolerance: { kind: absolute, value: 0.01 }
  inputLabel: { fr: "rayon R", en: "radius R" }
hints:
  - id: h1
    autonomy: 0.8
    text:
      fr: |-
        Regroupez les termes en $x$ d'un côté, ceux en $y$ de l'autre, puis complétez chacun des deux carrés comme pour une forme canonique.
      en: |-
        Group the terms in $x$ on one side, those in $y$ on the other, then complete each of the two squares as for a canonical form.
  - id: h2
    autonomy: 0.6
    text:
      fr: |-
        $x^2 - 2x = (x - 1)^2 - 1$ et $y^2 + 4y = (y + 2)^2 - 4$. L'équation doit prendre la forme $(x - x_0)^2 + (y - y_0)^2 = R^2$.
      en: |-
        $x^2 - 2x = (x - 1)^2 - 1$ and $y^2 + 4y = (y + 2)^2 - 4$. The equation must take the form $(x - x_0)^2 + (y - y_0)^2 = R^2$.
solution:
  fr: |-
    On complète les deux carrés séparément : $x^2 - 2x = (x - 1)^2 - 1$ et $y^2 + 4y = (y + 2)^2 - 4$. L'équation devient
    $$(x - 1)^2 - 1 + (y + 2)^2 - 4 - 4 = 0, \qquad \text{soit} \qquad (x - 1)^2 + (y + 2)^2 = 9.$$
    C'est l'équation du cercle de centre $\Omega(1\,;\,-2)$ et de rayon $R = \sqrt9 = 3$.

    **Interprétation.** L'équation traduit simplement que la distance $\Omega M$ vaut $3$, puisque $\Omega M^2 = (x - 1)^2 + (y + 2)^2$. Le second membre obtenu devait être positif : si l'on avait trouvé $-9$, aucun point n'aurait convenu et l'ensemble aurait été vide ; s'il avait été nul, $\mathcal{C}$ se serait réduit au seul point $\Omega$. On peut vérifier avec un point : $A(4\,;\,-2)$ donne $9 + 0 = 9$, il appartient bien au cercle.
  en: |-
    Complete the two squares separately: $x^2 - 2x = (x - 1)^2 - 1$ and $y^2 + 4y = (y + 2)^2 - 4$. The equation becomes
    $$(x - 1)^2 - 1 + (y + 2)^2 - 4 - 4 = 0, \qquad \text{that is} \qquad (x - 1)^2 + (y + 2)^2 = 9.$$
    This is the equation of the circle with centre $\Omega(1\,;\,-2)$ and radius $R = \sqrt9 = 3$.

    **Interpretation.** The equation simply states that the distance $\Omega M$ is $3$, since $\Omega M^2 = (x - 1)^2 + (y + 2)^2$. The right-hand side obtained had to be positive: had one found $-9$, no point would have worked and the set would have been empty; had it been zero, $\mathcal{C}$ would have reduced to the single point $\Omega$. One can check with a point: $A(4\,;\,-2)$ gives $9 + 0 = 9$, so it does belong to the circle.
