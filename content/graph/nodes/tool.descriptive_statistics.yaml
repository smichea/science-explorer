        - "déterminer la médiane et les quartiles d'une série par leur rang dans la série ordonnée"
        - "calculer l'étendue, l'écart interquartile et l'écart type, et interpréter la dispersion"
        - "comparer deux séries à l'aide d'un indicateur de position et d'un indicateur de dispersion"
      en:
