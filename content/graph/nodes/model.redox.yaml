        - "définir un oxydant, un réducteur et un couple oxydant-réducteur, et identifier une oxydation et une réduction comme une perte et un gain d'électrons"
        - "établir la demi-équation électronique d'un couple, y compris en solution aqueuse acide avec des ions H⁺ et des molécules d'eau"
        - "combiner deux demi-équations pour établir l'équation d'une réaction d'oxydoréduction, en compensant les électrons échangés"
        - "identifier, à partir de son équation, une réaction d'oxydoréduction, l'oxydant et le réducteur qui réagissent et les couples mis en jeu"
      en:
        - "define an oxidant, a reductant and an oxidant–reductant couple, and identify an oxidation and a reduction as a loss and a gain of electrons"
        - "establish the electronic half-equation of a couple, including in acidic aqueous solution with H⁺ ions and water molecules"
        - "combine two half-equations to establish the equation of a redox reaction, balancing the electrons exchanged"
        - "identify, from its equation, a redox reaction, the oxidant and the reductant that react and the couples involved"
