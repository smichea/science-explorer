id: tool.exponential
type: mathematical_tool
world: world.mathematics
region: region.math.functions_analysis
importance: 3
backpack: true
tags: [vertical-slice]
title: { fr: Fonction exponentielle, en: Exponential function }
shortPurpose:
  fr: La fonction égale à sa propre dérivée ; le modèle de toute évolution dont la vitesse est proportionnelle à la quantité présente.
  en: The function equal to its own derivative; the model of every evolution whose rate is proportional to the quantity present.
overview:
  fr: >-
    L'exponentielle est la fonction égale à sa propre dérivée. Dès qu'une grandeur varie à une vitesse proportionnelle à ce qui reste, elle apparaît : charge d'un condensateur, réaction d'ordre un, décroissance radioactive, chute freinée. Une seule fonction pour quatre phénomènes de trois mondes.
  en: >-
    The exponential is the function equal to its own derivative. It appears whenever a quantity changes at a rate proportional to what remains: capacitor charging, a first-order reaction, radioactive decay, fall with drag. One function for four phenomena from three worlds.
aliases:
  fr: ["exponentielle", "exp", "fonction exp(kt)", "croissance et décroissance exponentielles"]
  en: ["exponential", "exp", "exp(kt) function", "exponential growth and decay"]
description:
  fr: |
    La **fonction exponentielle** est l'unique fonction dérivable sur $\mathbb{R}$ telle que $f' = f$ et $f(0) = 1$ ; on la note $\exp$ ou $x \mapsto e^x$, avec $e = \exp(1) \approx 2{,}718$. Elle transforme les sommes en produits, $e^{a+b} = e^a\,e^b$, est strictement positive et strictement croissante, tend vers $0$ en $-\infty$ et vers $+\infty$ en $+\infty$ plus vite que toute puissance de $x$. Sa réciproque est le **logarithme népérien** $\ln$, défini sur $]0, +\infty[$ : $y = e^x \iff x = \ln y$.

    Le problème qu'elle résout est celui des évolutions dont **la vitesse est proportionnelle à la quantité présente** : l'équation $y' = k\,y$ a pour solutions exactement les fonctions $t \mapsto C\,e^{kt}$. Avec $k < 0$, la décroissance est d'autant plus rapide qu'il reste beaucoup à perdre : tension d'un condensateur qui se charge, concentration d'un réactif d'ordre 1, population de noyaux radioactifs, vitesse d'un mobile freiné par l'air. Dans tous ces cas, on écrit $y(t) = y_0\,e^{-t/\tau}$, où $\tau = 1/|k|$ est la **constante de temps** ; la quantité est divisée par $2$ tous les $t_{1/2} = \tau \ln 2$ (**demi-vie** ou temps de demi-réaction) et vaut encore $37\,\%$ de sa valeur initiale au bout de $\tau$.

    En Première, l'exponentielle est définie comme l'unique fonction dérivable sur $\mathbb{R}$ égale à sa dérivée et valant $1$ en $0$ ; on établit sa relation fonctionnelle, son signe, ses variations, sa courbe et son lien avec les suites géométriques. En Terminale, on ajoute ses limites et les croissances comparées, le logarithme népérien comme réciproque, la résolution de $e^x = k$ et les équations différentielles $y' = ay + b$. En MPSI, on la construit rigoureusement à partir du logarithme, on l'étend aux nombres complexes ($e^{i\theta} = \cos\theta + i\sin\theta$), on la relie aux fonctions hyperboliques et à son développement limité, et elle devient la brique de base de toutes les équations différentielles linéaires.
  en: |
    The **exponential function** is the unique function differentiable on $\mathbb{R}$ such that $f' = f$ and $f(0) = 1$; it is written $\exp$ or $x \mapsto e^x$, with $e = \exp(1) \approx 2.718$. It turns sums into products, $e^{a+b} = e^a\,e^b$, is strictly positive and strictly increasing, tends to $0$ at $-\infty$ and to $+\infty$ at $+\infty$ faster than any power of $x$. Its inverse is the **natural logarithm** $\ln$, defined on $]0, +\infty[$: $y = e^x \iff x = \ln y$.

    The problem it solves is that of evolutions whose **rate is proportional to the quantity present**: the equation $y' = k\,y$ has exactly the functions $t \mapsto C\,e^{kt}$ as solutions. With $k < 0$, the decay is faster when there is more left to lose: voltage of a charging capacitor, concentration of a first-order reactant, population of radioactive nuclei, velocity of a body slowed by air. In all these cases one writes $y(t) = y_0\,e^{-t/\tau}$, where $\tau = 1/|k|$ is the **time constant**; the quantity is divided by $2$ every $t_{1/2} = \tau \ln 2$ (**half-life**) and is still $37\,\%$ of its initial value after $\tau$.

    In Grade 11, the exponential is defined as the unique function differentiable on $\mathbb{R}$ equal to its own derivative and taking the value $1$ at $0$; its functional relation, sign, variations, curve and link with geometric sequences are established. In Grade 12, one adds its limits and comparative growth, the natural logarithm as its inverse, the solving of $e^x = k$ and the differential equations $y' = ay + b$. In MPSI, it is constructed rigorously from the logarithm, extended to complex numbers ($e^{i\theta} = \cos\theta + i\sin\theta$), related to the hyperbolic functions and to its Taylor expansion, and it becomes the building block of every linear differential equation.
tool:
  problemSolved:
    fr: "Décrire une grandeur dont la vitesse de variation est proportionnelle à sa valeur, et en calculer la constante de temps ou la demi-vie."
    en: "Describe a quantity whose rate of change is proportional to its value, and compute its time constant or half-life."
  construction:
    fr: "On cherche une fonction égale à sa dérivée : on montre qu'il en existe une et une seule qui vaut $1$ en $0$, on la note $\\exp$ ; les solutions de $y' = ky$ sont alors exactement les fonctions $t \\mapsto C\\,e^{kt}$."
    en: "Look for a function equal to its own derivative: show that there is exactly one taking the value $1$ at $0$, call it $\\exp$; the solutions of $y' = ky$ are then exactly the functions $t \\mapsto C\\,e^{kt}$."
  icon: growth
depths:
  - depth: 1
    stage: premiere
    role: core
    outcomes:
      fr:
        - "définir l'exponentielle comme l'unique fonction dérivable sur $\\mathbb{R}$ telle que $f' = f$ et $f(0) = 1$, et utiliser $(e^x)' = e^x$"
        - "transformer une expression avec $e^{a+b} = e^a e^b$, $e^{-a} = 1/e^a$ et $(e^a)^n = e^{na}$"
        - "connaître le signe, le sens de variation et la courbe de $x \\mapsto e^x$, et dériver $x \\mapsto e^{kx}$"
        - "reconnaître la suite géométrique $(e^{na})$ et modéliser une croissance ou une décroissance exponentielle"
      en:
        - "define the exponential as the unique function differentiable on $\\mathbb{R}$ such that $f' = f$ and $f(0) = 1$, and use $(e^x)' = e^x$"
        - "transform an expression with $e^{a+b} = e^a e^b$, $e^{-a} = 1/e^a$ and $(e^a)^n = e^{na}$"
        - "know the sign, the variations and the curve of $x \\mapsto e^x$, and differentiate $x \\mapsto e^{kx}$"
        - "recognise the geometric sequence $(e^{na})$ and model an exponential growth or decay"
    lesson:
      fr: |
        **Définition et propriétés algébriques.** Il existe une unique fonction $f$ dérivable sur $\mathbb{R}$ telle que $f' = f$ et $f(0) = 1$ : c'est la **fonction exponentielle**, notée $\exp$. On pose $e = \exp(1) \approx 2{,}718$ et l'on écrit $\exp(x) = e^x$. Pour tous réels $a$ et $b$ et tout entier relatif $n$ : $e^{a+b} = e^a\,e^b$, $e^{-a} = \dfrac{1}{e^a}$, $e^{a-b} = \dfrac{e^a}{e^b}$ et $\left(e^a\right)^n = e^{na}$. Ce sont les règles des puissances : par exemple $e^{3} \times e^{-1} = e^{2}$ et $\dfrac{e^{2x}}{e^{x}} = e^{x}$.

        **Signe, variations, courbe et dérivée.** L'exponentielle est strictement positive sur $\mathbb{R}$ et strictement croissante : $e^a < e^b$ équivaut à $a < b$, et $e^a = e^b$ équivaut à $a = b$. Sa courbe passe par les points $(0\,;\,1)$ et $(1\,;\,e)$, s'écrase sur l'axe des abscisses à gauche et monte de plus en plus vite à droite ; la tangente en $0$ a pour pente $1$. Pour tout réel $k$, la fonction $x \mapsto e^{kx}$ est dérivable, de dérivée $x \mapsto k\,e^{kx}$ : elle vérifie donc $y' = k\,y$, sa vitesse de variation est proportionnelle à sa valeur. Si $k > 0$ elle est croissante (croissance exponentielle), si $k < 0$ elle est décroissante vers $0$ (décroissance exponentielle).

        **Lien avec les suites géométriques.** Pour tout réel $a$, la suite $u_n = e^{na}$ vérifie $u_{n+1} = e^{a}\,u_n$ : c'est une suite géométrique de raison $q = e^{a}$, et réciproquement toute suite géométrique de raison $q > 0$ s'écrit $u_0\,q^n$ avec $q = e^a$. Une population de bactéries qui double toutes les heures est ainsi modélisée par $N(t) = N_0\,e^{kt}$ avec $e^{k} = 2$, soit $N(t) = N_0 \times 2^t$ : l'exponentielle est la version continue de la suite géométrique. Trouver $k$ tel que $e^{k} = 2$ demande le logarithme, qui attend la Terminale ; en Première, on lit $k$ sur la courbe ou par essais successifs.
      en: |
        **Definition and algebraic properties.** There is a unique function $f$ differentiable on $\mathbb{R}$ such that $f' = f$ and $f(0) = 1$: it is the **exponential function**, written $\exp$. One sets $e = \exp(1) \approx 2.718$ and writes $\exp(x) = e^x$. For all real numbers $a$ and $b$ and every relative integer $n$: $e^{a+b} = e^a\,e^b$, $e^{-a} = \dfrac{1}{e^a}$, $e^{a-b} = \dfrac{e^a}{e^b}$ and $\left(e^a\right)^n = e^{na}$. These are the rules of powers: for instance $e^{3} \times e^{-1} = e^{2}$ and $\dfrac{e^{2x}}{e^{x}} = e^{x}$.

        **Sign, variations, curve and derivative.** The exponential is strictly positive on $\mathbb{R}$ and strictly increasing: $e^a < e^b$ is equivalent to $a < b$, and $e^a = e^b$ is equivalent to $a = b$. Its curve passes through the points $(0\,;\,1)$ and $(1\,;\,e)$, flattens onto the horizontal axis on the left and rises faster and faster on the right; the tangent at $0$ has slope $1$. For every real number $k$, the function $x \mapsto e^{kx}$ is differentiable, with derivative $x \mapsto k\,e^{kx}$: it therefore satisfies $y' = k\,y$, its rate of change is proportional to its value. If $k > 0$ it is increasing (exponential growth), if $k < 0$ it decreases towards $0$ (exponential decay).

        **Link with geometric sequences.** For every real number $a$, the sequence $u_n = e^{na}$ satisfies $u_{n+1} = e^{a}\,u_n$: it is a geometric sequence of ratio $q = e^{a}$, and conversely every geometric sequence of ratio $q > 0$ is written $u_0\,q^n$ with $q = e^a$. A population of bacteria that doubles every hour is thus modelled by $N(t) = N_0\,e^{kt}$ with $e^{k} = 2$, that is $N(t) = N_0 \times 2^t$: the exponential is the continuous version of the geometric sequence. Finding $k$ such that $e^{k} = 2$ requires the logarithm, which waits for Grade 12; in Grade 11, $k$ is read on the curve or found by successive trials.
  - depth: 2
    stage: terminale
    role: core
    outcomes:
      fr:
        - "étudier les limites de l'exponentielle en $-\\infty$ et en $+\\infty$ et utiliser les croissances comparées de $e^x$ et de $x^n$"
        - "utiliser le logarithme népérien comme réciproque de l'exponentielle, $\\ln(e^x) = x$ et $e^{\\ln y} = y$, et résoudre $e^x = k$"
        - "reconnaître $t \\mapsto C e^{kt}$ comme les solutions de $y' = ky$ et résoudre $y' = ay + b$ avec une condition initiale"
        - "déterminer une constante de temps ou une demi-vie à partir d'une courbe ou d'un tableau de mesures"
      en:
        - "study the limits of the exponential at $-\\infty$ and at $+\\infty$ and use the comparative growth of $e^x$ and $x^n$"
        - "use the natural logarithm as the inverse of the exponential, $\\ln(e^x) = x$ and $e^{\\ln y} = y$, and solve $e^x = k$"
        - "recognise $t \\mapsto C e^{kt}$ as the solutions of $y' = ky$ and solve $y' = ay + b$ with an initial condition"
        - "determine a time constant or a half-life from a curve or a table of measurements"
    lesson:
      fr: |
        **Limites et croissances comparées.** $\lim_{x \to -\infty} e^x = 0$ et $\lim_{x \to +\infty} e^x = +\infty$ : l'axe des abscisses est asymptote à la courbe en $-\infty$. Surtout, l'exponentielle l'emporte sur toute puissance : $\lim_{x \to +\infty} \dfrac{e^x}{x^n} = +\infty$ pour tout entier $n$, et $\lim_{x \to -\infty} x^n e^x = 0$ ; ce sont les **croissances comparées**, qui lèvent les formes indéterminées « $\infty / \infty$ » et « $0 \times \infty$ ». La comparaison des courbes de $e^x$, $x^2$ et $x^3$ montre que la puissance peut dominer un moment, mais que l'exponentielle finit toujours par la dépasser.

        **Logarithme népérien et équations.** L'exponentielle est continue et strictement croissante de $\mathbb{R}$ sur $]0\,;\,+\infty[$ : pour tout $y > 0$, l'équation $e^x = y$ a une unique solution, notée $\ln y$. Le **logarithme népérien** est donc la fonction réciproque de l'exponentielle : $\ln(e^x) = x$ pour tout réel $x$, $e^{\ln y} = y$ pour $y > 0$, $\ln 1 = 0$, $\ln e = 1$, et sa courbe est la symétrique de celle de $\exp$ par rapport à la droite $y = x$. Il transforme les produits en sommes, $\ln(ab) = \ln a + \ln b$ et $\ln(a^n) = n\ln a$, et il est dérivable sur $]0\,;\,+\infty[$ de dérivée $\dfrac1x$. C'est lui qui résout les équations exponentielles : $e^{kt} = c$ équivaut à $kt = \ln c$, et $5\,e^{-t} = 1$ donne $t = \ln 5 \approx 1{,}61$.

        **Équations différentielles, constante de temps et demi-vie.** Les solutions de $y' = k\,y$ sur $\mathbb{R}$ sont exactement les fonctions $t \mapsto C\,e^{kt}$, $C$ réel ; celles de $y' = a\,y + b$ ($a \neq 0$) sont $t \mapsto C\,e^{at} - \dfrac{b}{a}$, somme d'une solution de l'équation sans second membre et de la solution constante. Une condition initiale $y(0) = y_0$ fixe $C$, donc une seule courbe. Pour $y(t) = y_0\,e^{-t/\tau}$ avec $\tau > 0$ : au bout de $\tau$ il reste $y_0/e \approx 0{,}37\,y_0$, au bout de $5\tau$ moins de $1\,\%$ ; la durée au bout de laquelle la quantité est divisée par $2$ vaut $t_{1/2} = \tau \ln 2 \approx 0{,}69\,\tau$ et ne dépend pas de $y_0$ : c'est la signature d'une décroissance exponentielle. Sur un graphique, la tangente à l'origine coupe l'asymptote en $t = \tau$ ; en échelle semi-logarithmique, $\ln y = \ln y_0 - t/\tau$ est une droite de pente $-1/\tau$.
      en: |
        **Limits and comparative growth.** $\lim_{x \to -\infty} e^x = 0$ and $\lim_{x \to +\infty} e^x = +\infty$: the horizontal axis is an asymptote to the curve at $-\infty$. Above all, the exponential beats every power: $\lim_{x \to +\infty} \dfrac{e^x}{x^n} = +\infty$ for every integer $n$, and $\lim_{x \to -\infty} x^n e^x = 0$; this is **comparative growth**, which settles the indeterminate forms "$\infty / \infty$" and "$0 \times \infty$". Comparing the curves of $e^x$, $x^2$ and $x^3$ shows that the power may dominate for a while, but that the exponential always overtakes it in the end.

        **Natural logarithm and equations.** The exponential is continuous and strictly increasing from $\mathbb{R}$ onto $]0\,;\,+\infty[$: for every $y > 0$, the equation $e^x = y$ has a unique solution, written $\ln y$. The **natural logarithm** is therefore the inverse function of the exponential: $\ln(e^x) = x$ for every real $x$, $e^{\ln y} = y$ for $y > 0$, $\ln 1 = 0$, $\ln e = 1$, and its curve is the mirror image of that of $\exp$ across the line $y = x$. It turns products into sums, $\ln(ab) = \ln a + \ln b$ and $\ln(a^n) = n\ln a$, and it is differentiable on $]0\,;\,+\infty[$ with derivative $\dfrac1x$. It is what solves exponential equations: $e^{kt} = c$ is equivalent to $kt = \ln c$, and $5\,e^{-t} = 1$ gives $t = \ln 5 \approx 1.61$.

        **Differential equations, time constant and half-life.** The solutions of $y' = k\,y$ on $\mathbb{R}$ are exactly the functions $t \mapsto C\,e^{kt}$, $C$ real; those of $y' = a\,y + b$ ($a \neq 0$) are $t \mapsto C\,e^{at} - \dfrac{b}{a}$, the sum of a solution of the homogeneous equation and of the constant solution. An initial condition $y(0) = y_0$ fixes $C$, hence a single curve. For $y(t) = y_0\,e^{-t/\tau}$ with $\tau > 0$: after $\tau$ there remains $y_0/e \approx 0.37\,y_0$, after $5\tau$ less than $1\,\%$; the time after which the quantity is divided by $2$ is $t_{1/2} = \tau \ln 2 \approx 0.69\,\tau$ and does not depend on $y_0$: this is the signature of an exponential decay. On a graph, the tangent at the origin meets the asymptote at $t = \tau$; on a semi-logarithmic scale, $\ln y = \ln y_0 - t/\tau$ is a straight line of slope $-1/\tau$.
  - depth: 3
    stage: mpsi
    role: core
    outcomes:
      fr:
        - "construire $\\exp$ comme réciproque du logarithme et démontrer l'unicité de la solution de $y' = y$, $y(0) = 1$"
        - "utiliser l'exponentielle complexe $e^{i\\theta} = \\cos\\theta + i\\sin\\theta$ pour la trigonométrie et les oscillations"
        - "relier l'exponentielle aux fonctions hyperboliques, aux fonctions puissances et à son développement limité"
        - "résoudre $y' = a(t)\\,y$ à l'aide de l'exponentielle d'une primitive"
      en:
        - "construct $\\exp$ as the inverse of the logarithm and prove the uniqueness of the solution of $y' = y$, $y(0) = 1$"
        - "use the complex exponential $e^{i\\theta} = \\cos\\theta + i\\sin\\theta$ for trigonometry and oscillations"
        - "relate the exponential to the hyperbolic functions, to power functions and to its Taylor expansion"
        - "solve $y' = a(t)\\,y$ using the exponential of an antiderivative"
    lesson:
      fr: |
        **Construction.** En MPSI, on définit $\ln$ comme l'unique primitive de $x \mapsto 1/x$ sur $]0,+\infty[$ qui s'annule en $1$ ; c'est une bijection strictement croissante de $]0,+\infty[$ sur $\mathbb{R}$, et $\exp$ est sa réciproque. Le théorème de dérivation des fonctions réciproques donne $\exp' = \exp$, et l'unicité de la solution de $y' = y$, $y(0) = 1$ se démontre en dérivant $t \mapsto y(t)\,e^{-t}$, dont la dérivée est nulle. Les fonctions puissances $x^\alpha = e^{\alpha \ln x}$ et les fonctions hyperboliques $\operatorname{ch} x = \dfrac{e^x + e^{-x}}{2}$, $\operatorname{sh} x = \dfrac{e^x - e^{-x}}{2}$ en découlent.

        **Exponentielle complexe.** Pour $z = a + ib$, on pose $e^{z} = e^{a}(\cos b + i \sin b)$ ; la relation $e^{z+z'} = e^z\,e^{z'}$ subsiste, et $e^{i\theta} = \cos\theta + i\sin\theta$ (formule d'Euler) code les rotations et les oscillations. La fonction $t \mapsto e^{\lambda t}$, avec $\lambda \in \mathbb{C}$, est dérivable de dérivée $\lambda\,e^{\lambda t}$ : c'est pourquoi les solutions de toutes les équations différentielles linéaires à coefficients constants s'écrivent avec des exponentielles, réelles ou complexes.

        **Comportements asymptotiques.** Croissances comparées : $x^\alpha = o(e^x)$ en $+\infty$ et $\ln x = o(x^\alpha)$ pour tout $\alpha > 0$. Développement limité en $0$ : $e^x = 1 + x + \dfrac{x^2}{2} + \dots + \dfrac{x^n}{n!} + o(x^n)$, ce qui justifie l'approximation $e^{-t/\tau} \approx 1 - t/\tau$ aux temps courts et la lecture de $\tau$ sur la tangente à l'origine.
      en: |
        **Construction.** In MPSI, $\ln$ is defined as the unique antiderivative of $x \mapsto 1/x$ on $]0,+\infty[$ that vanishes at $1$; it is a strictly increasing bijection from $]0,+\infty[$ onto $\mathbb{R}$, and $\exp$ is its inverse. The theorem on derivatives of inverse functions gives $\exp' = \exp$, and the uniqueness of the solution of $y' = y$, $y(0) = 1$ is proved by differentiating $t \mapsto y(t)\,e^{-t}$, whose derivative is zero. Power functions $x^\alpha = e^{\alpha \ln x}$ and hyperbolic functions $\operatorname{ch} x = \dfrac{e^x + e^{-x}}{2}$, $\operatorname{sh} x = \dfrac{e^x - e^{-x}}{2}$ follow from it.

        **Complex exponential.** For $z = a + ib$ one sets $e^{z} = e^{a}(\cos b + i \sin b)$; the relation $e^{z+z'} = e^z\,e^{z'}$ still holds, and $e^{i\theta} = \cos\theta + i\sin\theta$ (Euler's formula) encodes rotations and oscillations. The function $t \mapsto e^{\lambda t}$, with $\lambda \in \mathbb{C}$, is differentiable with derivative $\lambda\,e^{\lambda t}$: this is why the solutions of all linear differential equations with constant coefficients are written with exponentials, real or complex.

        **Asymptotic behaviour.** Comparative growth: $x^\alpha = o(e^x)$ at $+\infty$ and $\ln x = o(x^\alpha)$ for every $\alpha > 0$. Taylor expansion at $0$: $e^x = 1 + x + \dfrac{x^2}{2} + \dots + \dfrac{x^n}{n!} + o(x^n)$, which justifies the approximation $e^{-t/\tau} \approx 1 - t/\tau$ at short times and the reading of $\tau$ on the tangent at the origin.
