        - "tracer et exploiter un diagramme de prédominance ou de distribution pour déterminer l'espèce prédominante d'un couple à un pH donné"
        - "distinguer un acide fort d'un acide faible par le taux d'avancement final de sa réaction avec l'eau, et calculer ce taux à partir du pH"
      en:
        - "identify a Brønsted acid and base, write the half-equation of an acid-base couple and the equation of an acid-base reaction as a proton transfer"
        - "relate the pH and the oxonium ion concentration by pH = −log([H₃O⁺]/c°) and [H₃O⁺] = c° × 10^(−pH), and use the ionic product of water"
        - "write the acidity constant KA of a couple, relate it to the pKa and establish the relation pH = pKa + log([base]/[acid])"
        - "draw and use a predominance or a distribution diagram to determine the predominant species of a couple at a given pH"
        - "distinguish a strong acid from a weak acid by the final rate of its reaction with water, and compute that rate from the pH"
