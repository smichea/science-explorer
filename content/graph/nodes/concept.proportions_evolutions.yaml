        - "déterminer le taux d'évolution réciproque d'une évolution donnée"
      en:
        - "compute a proportion, express it as a percentage and compute a proportion of a proportion"
        - "compute a rate of change and the associated multiplier, and convert one into the other"
        - "compute the overall rate of several successive changes by multiplying the multipliers"
        - "determine the reciprocal rate of a given change"
