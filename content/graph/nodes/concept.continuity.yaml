        - "appliquer le théorème des valeurs intermédiaires et son corollaire pour prouver l'existence et l'unicité d'une solution"
        - "encadrer une solution par dichotomie et majorer l'erreur par $2^{-n}$ fois la longueur initiale"
        - "programmer ou dérouler l'algorithme de dichotomie sur un exemple"
      en:
        - "recognise a function continuous on an interval and give a counter-example of a non-continuous function"
        - "apply the intermediate value theorem and its corollary to prove the existence and uniqueness of a solution"
        - "bracket a solution by bisection and bound the error by $2^{-n}$ times the initial length"
        - "program or run through the bisection algorithm on an example"
