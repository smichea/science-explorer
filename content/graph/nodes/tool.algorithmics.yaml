title: { fr: "Algorithmique et programmation", en: "Algorithmics and programming" }
shortPurpose:
  fr: "Décrire un calcul par une suite d'instructions, variables, tests et boucles, et l'exécuter en Python pour calculer, chercher ou simuler."
  en: "Describe a computation by a sequence of instructions, variables, tests and loops, and run it in Python to compute, search or simulate."
overview:
  fr: >-
    Un algorithme est une suite finie d'instructions qui produit un résultat à partir de données. Avec des variables, une instruction conditionnelle et deux sortes de boucles, on calcule les termes d'une suite, on cherche un nombre premier ou l'on simule cent lancers de pièce. Écrit en Python, l'algorithme s'exécute, se vérifie et se corrige : c'est un laboratoire pour les mathématiques.
  en: >-
    An algorithm is a finite sequence of instructions that produces a result from data. With variables, a conditional statement and two kinds of loops, one computes the terms of a sequence, searches for a prime number or simulates a hundred coin tosses. Written in Python, the algorithm runs, is checked and corrected: it is a laboratory for mathematics.
aliases:
  fr: ["algorithme", "programmation en Python", "variable et affectation", "boucle for et boucle while", "fonction en Python", "simulation"]
  en: ["algorithm", "programming in Python", "variable and assignment", "for loop and while loop", "function in Python", "simulation"]
description:
  fr: |
    En **algorithmique**, une **variable** est un nom qui désigne une valeur rangée en mémoire, et l'**affectation** `u = 2 * u + 1` calcule d'abord le membre de droite avec la valeur actuelle de `u`, puis range le résultat dans `u`. Le signe `=` n'est donc pas une égalité mathématique mais une action, et `u = u + 1` signifie « augmenter `u` de un ». Une **instruction conditionnelle** `if condition:` suivie éventuellement de `else:` exécute un bloc ou l'autre selon qu'une condition est vraie ou fausse ; en Python, les blocs sont délimités par l'indentation, et les comparaisons s'écrivent `==`, `!=`, `<`, `<=`. Un algorithme est une suite finie d'instructions qui, à partir de données, produit un résultat ; l'écrire en Python le rend exécutable et vérifiable.

    Une **boucle bornée** `for i in range(n):` répète un bloc un nombre de fois connu à l'avance ; `range(4)` parcourt $0, 1, 2, 3$. Le programme
    ```python
    u = 1
    for i in range(4):
        u = 2 * u + 1
    ```
    calcule successivement $3$, $7$, $15$ et $31$ : ce sont les premiers termes de la suite définie par $u_{n+1} = 2u_n + 1$ et $u_0 = 1$. Une **boucle non bornée** `while condition:` répète tant que la condition reste vraie, et le nombre de tours n'est pas connu d'avance : `n = 0` puis `while 2 ** n < 1000: n = n + 1` s'arrête avec `n` égal à $10$, car $2^{10} = 1024$ est la première puissance de $2$ qui dépasse $1000$. Il faut s'assurer que la condition finira par devenir fausse, sans quoi la boucle ne s'arrête jamais.

    Une **fonction** regroupe des instructions sous un nom, avec des paramètres et un résultat renvoyé par `return` : `def image(x): return x ** 2 - 3 * x` définit la fonction mathématique $x \mapsto x^2 - 3x$, et `image(5)` vaut $10$. Les fonctions permettent aussi de **simuler** une expérience aléatoire : `random()` renvoie un réel au hasard dans $[0\,;\,1[$, donc `random() < 0.5` vaut `True` avec la probabilité $\dfrac12$, comme un lancer de pièce. Répéter ce tirage dans une boucle et compter les succès donne la fréquence d'un échantillon, et l'on observe la fluctuation d'échantillonnage sans manipuler une seule pièce : c'est ainsi que les probabilités deviennent expérimentales.
  en: |
    In **algorithmics**, a **variable** is a name that refers to a value stored in memory, and the **assignment** `u = 2 * u + 1` first computes the right-hand side with the current value of `u`, then stores the result in `u`. The `=` sign is therefore not a mathematical equality but an action, and `u = u + 1` means "increase `u` by one". A **conditional statement** `if condition:` possibly followed by `else:` runs one block or the other depending on whether a condition is true or false; in Python, blocks are delimited by indentation, and comparisons are written `==`, `!=`, `<`, `<=`. An algorithm is a finite sequence of instructions which, from data, produces a result; writing it in Python makes it executable and checkable.

    A **bounded loop** `for i in range(n):` repeats a block a number of times known in advance; `range(4)` runs through $0, 1, 2, 3$. The program
    ```python
    u = 1
    for i in range(4):
        u = 2 * u + 1
    ```
    successively computes $3$, $7$, $15$ and $31$: these are the first terms of the sequence defined by $u_{n+1} = 2u_n + 1$ and $u_0 = 1$. An **unbounded loop** `while condition:` repeats as long as the condition stays true, and the number of turns is not known beforehand: `n = 0` then `while 2 ** n < 1000: n = n + 1` stops with `n` equal to $10$, because $2^{10} = 1024$ is the first power of $2$ exceeding $1000$. One must make sure that the condition will eventually become false, otherwise the loop never stops.

    A **function** gathers instructions under a name, with parameters and a result returned by `return`: `def image(x): return x ** 2 - 3 * x` defines the mathematical function $x \mapsto x^2 - 3x$, and `image(5)` is $10$. Functions also allow one to **simulate** a random experiment: `random()` returns a real at random in $[0\,;\,1[$, so `random() < 0.5` is `True` with probability $\dfrac12$, like a coin toss. Repeating this draw in a loop and counting the successes gives the frequency of a sample, and sampling fluctuation is observed without handling a single coin: this is how probabilities become experimental.
depths:
  - depth: 1
    stage: seconde
    role: core
    outcomes:
      fr:
        - "utiliser des variables, des affectations et une instruction conditionnelle pour écrire un algorithme simple"
        - "programmer une boucle bornée (for) et une boucle non bornée (while), et prévoir la valeur des variables à la sortie"
        - "définir et appeler une fonction en Python, avec des paramètres et une valeur renvoyée"
        - "simuler une expérience aléatoire avec random() et calculer la fréquence d'un événement sur un échantillon"
      en:
        - "use variables, assignments and a conditional statement to write a simple algorithm"
        - "program a bounded loop (for) and an unbounded loop (while), and predict the value of the variables at the exit"
        - "define and call a function in Python, with parameters and a returned value"
        - "simulate a random experiment with random() and compute the frequency of an event on a sample"
  - depth: 2
    stage: premiere
    role: core
    outcomes:
      fr:
        - "créer une liste, accéder à un élément par son indice, la parcourir avec une boucle et l'allonger avec append"
        - "écrire des boucles imbriquées et des fonctions à plusieurs paramètres, et prévoir leur résultat"
        - "calculer les termes d'une suite définie par récurrence avec une boucle et les stocker dans une liste"
        - "simuler une variable aléatoire et calculer la moyenne d'un échantillon pour l'approcher de son espérance"
      en:
        - "create a list, access an element by its index, traverse it with a loop and extend it with append"
        - "write nested loops and functions with several parameters, and predict their result"
        - "compute the terms of a recursively defined sequence with a loop and store them in a list"
        - "simulate a random variable and compute the mean of a sample to approach its expectation"
    lesson:
      fr: |
        **Listes.** Une **liste** range plusieurs valeurs sous un seul nom : `L = [3, 7, 15, 31]`. On accède à un élément par son **indice**, qui commence à $0$ : `L[0]` vaut $3$ et `L[3]` vaut $31$ ; `len(L)` donne la longueur, ici $4$. On parcourt une liste avec `for x in L:` ou avec `for i in range(len(L)):`, et `L.append(63)` ajoute une valeur à la fin. Ainsi, le programme
        ```python
        u = 1
        L = [u]
        for i in range(4):
            u = 2 * u + 1
            L.append(u)
        ```
        construit la liste `[1, 3, 7, 15, 31]` des cinq premiers termes de la suite $u_{n+1} = 2u_n + 1$, $u_0 = 1$ ; `L[n]` est alors $u_n$. Une somme se calcule en accumulant dans une variable initialisée à $0$, et les **boucles imbriquées** parcourent un tableau ligne par ligne : `for i in range(3):` suivi de `for j in range(4):` exécute le bloc intérieur $12$ fois.

        **Fonctions et simulation.** Une fonction peut prendre plusieurs paramètres et renvoyer une liste : `def termes(a, n):` calcule les $n$ premiers termes d'une suite de premier terme `a`. Pour simuler une **variable aléatoire**, `randint(1, 6)` renvoie un entier au hasard entre $1$ et $6$, et une fonction `gain()` associe une valeur à chaque issue ; la moyenne d'un échantillon de $1000$ parties, somme des gains divisée par $1000$, fluctue autour de l'espérance $E(X)$. La boucle qui répète l'expérience et accumule les résultats est le même geste que celle qui calcule les termes d'une suite : l'algorithme rend expérimentaux les objets mathématiques de Première.
      en: |
        **Lists.** A **list** stores several values under a single name: `L = [3, 7, 15, 31]`. An element is accessed by its **index**, which starts at $0$: `L[0]` is $3$ and `L[3]` is $31$; `len(L)` gives the length, here $4$. A list is traversed with `for x in L:` or with `for i in range(len(L)):`, and `L.append(63)` adds a value at the end. Thus, the program
        ```python
        u = 1
        L = [u]
        for i in range(4):
            u = 2 * u + 1
            L.append(u)
        ```
        builds the list `[1, 3, 7, 15, 31]` of the first five terms of the sequence $u_{n+1} = 2u_n + 1$, $u_0 = 1$; `L[n]` is then $u_n$. A sum is computed by accumulating in a variable initialised at $0$, and **nested loops** run through a table row by row: `for i in range(3):` followed by `for j in range(4):` executes the inner block $12$ times.

        **Functions and simulation.** A function may take several parameters and return a list: `def termes(a, n):` computes the first $n$ terms of a sequence with first term `a`. To simulate a **random variable**, `randint(1, 6)` returns an integer at random between $1$ and $6$, and a function `gain()` attaches a value to each outcome; the mean of a sample of $1000$ games, the sum of the gains divided by $1000$, fluctuates around the expectation $E(X)$. The loop that repeats the experiment and accumulates the results is the same move as the one computing the terms of a sequence: the algorithm makes the mathematical objects of Grade 11 experimental.
  - depth: 3
    stage: terminale
    role: extension_and_application
    outcomes:
      fr:
        - "écrire une fonction Python qui renvoie une valeur et l'appeler dans un autre calcul"
        - "programmer les termes d'une suite définie par récurrence et le seuil à partir duquel elle dépasse une valeur"
        - "programmer une recherche par dichotomie d'une solution de $f(x) = 0$ avec une précision donnée"
        - "programmer une somme de Riemann pour approcher une intégrale, et une simulation d'échantillonnage"
      en:
        - "write a Python function that returns a value and call it inside another computation"
        - "program the terms of a sequence defined by a recurrence, and the threshold beyond which it passes a value"
        - "program a bisection search for a solution of $f(x) = 0$ to a given precision"
        - "program a Riemann sum to approach an integral, and a sampling simulation"
