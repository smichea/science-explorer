id: method.instrumental_analysis
type: method
world: world.chemistry
region: region.chemistry.amount_measurement
importance: 2
tags: [lycee]
title: { fr: "Spectrophotométrie et conductimétrie : mesurer une concentration sans détruire l'échantillon", en: "Spectrophotometry and conductimetry: measuring a concentration without destroying the sample" }
shortPurpose:
  fr: "Déterminer une concentration par étalonnage : mesurer l'absorbance ou la conductivité d'une solution, construire la droite d'étalonnage et y lire la concentration cherchée."
  en: "Determine a concentration by calibration: measure the absorbance or the conductivity of a solution, build the calibration line and read the sought concentration on it."
overview:
  fr: >-
    Doser une espèce sans la faire réagir, c'est mesurer une grandeur physique qui lui est proportionnelle. Une solution colorée absorbe la lumière d'autant plus qu'elle est concentrée : c'est la spectrophotométrie, et l'absorbance se lit à la longueur d'onde où l'espèce absorbe le mieux. Une solution ionique conduit le courant d'autant mieux qu'elle contient d'ions : c'est la conductimétrie. Dans les deux cas, on prépare d'abord des solutions de concentrations connues, on reporte les mesures sur un graphique, et la droite qui passe par ces points sert de règle graduée : on y lit la concentration de l'échantillon à partir de sa seule mesure. La conductimétrie sait aussi suivre un titrage, dont la courbe est alors faite de deux segments de droite qui se coupent à l'équivalence.
  en: >-
    Assaying a species without making it react means measuring a physical quantity proportional to it. A coloured solution absorbs light all the more as it is concentrated: that is spectrophotometry, and the absorbance is read at the wavelength where the species absorbs best. An ionic solution conducts current all the better as it contains more ions: that is conductimetry. In both cases, solutions of known concentration are prepared first, the measurements are plotted on a graph, and the line through those points serves as a graduated ruler: the concentration of the sample is read on it from its single measurement. Conductimetry can also follow a titration, whose curve is then made of two straight segments crossing at the equivalence.
aliases:
  fr: ["dosage par étalonnage", "spectrophotométrie", "loi de Beer-Lambert", "absorbance", "conductimétrie", "conductivité", "droite d'étalonnage"]
  en: ["assay by calibration", "spectrophotometry", "Beer-Lambert law", "absorbance", "conductimetry", "conductivity", "calibration line"]
description:
  fr: |
    Un **dosage par étalonnage** détermine une concentration sans consommer l'espèce dosée : on mesure une grandeur physique proportionnelle à sa concentration, puis on compare la mesure à celles d'une gamme de solutions de concentrations connues. En **spectrophotométrie**, cette grandeur est l'**absorbance** $A$, un nombre sans unité que l'appareil calcule à partir de l'intensité lumineuse transmise. La **loi de Beer-Lambert** l'exprime pour une solution diluée d'une seule espèce colorée : $A = \varepsilon\,\ell\,C$, où $\ell$ est la longueur de la cuve, en centimètres, $C$ la concentration en $\mathrm{mol/L}$ et $\varepsilon$ le coefficient d'absorption molaire, en $\mathrm{L\cdot mol^{-1}\cdot cm^{-1}}$, qui dépend de l'espèce, du solvant et de la longueur d'onde. On travaille à la longueur d'onde $\lambda_{\max}$ où l'espèce absorbe le plus, lue sur son spectre d'absorption, car la mesure y est la plus sensible et la moins sensible aux erreurs de réglage ; on règle d'abord le **blanc**, une cuve de solvant pur, qui fixe le zéro d'absorbance. En **conductimétrie**, la grandeur mesurée est la **conductivité** $\sigma$, en $\mathrm{S/m}$ ou en $\mathrm{mS/cm}$, somme des contributions de tous les ions : $\sigma = \sum_i \lambda_i\,[\mathrm{X}_i]$, où $\lambda_i$ est la conductivité molaire ionique de l'ion $\mathrm{X}_i$. Elle ne distingue pas les ions les uns des autres, mais elle voit les solutions incolores.

    La **droite d'étalonnage** transforme ces lois en instrument de mesure. On prépare par dilutions successives cinq ou six solutions de concentrations connues, on mesure la grandeur pour chacune, on reporte les points et l'on ajuste une droite passant par l'origine, dont le coefficient directeur $k$ est ensuite lu à l'envers : $C = A/k$. Exemple : une gamme d'ions permanganate mesurée à $\lambda_{\max} = 540\ \mathrm{nm}$ dans une cuve de $\ell = 1{,}0\ \mathrm{cm}$ donne la droite $A = 2{,}5\times10^{3}\,C$, avec $C$ en $\mathrm{mol/L}$, c'est-à-dire $\varepsilon = 2{,}5\times10^{3}\ \mathrm{L\cdot mol^{-1}\cdot cm^{-1}}$. Un échantillon dont l'absorbance vaut $A = 0{,}72$ a donc pour concentration $C = \dfrac{0{,}72}{2{,}5\times10^{3}} = 2{,}9\times10^{-4}\ \mathrm{mol/L}$. La qualité du résultat se lit sur l'alignement des points, et l'incertitude sur la concentration se déduit de celle de la mesure et de celle de la pente ; hors du domaine de la gamme, l'extrapolation n'est pas légitime.

    La conductimétrie sert aussi au **suivi d'un titrage** : au lieu de chercher un changement de couleur, on mesure la conductivité après chaque ajout. Comme chaque ion a sa propre conductivité molaire, la courbe $\sigma = f(V)$ est faite de **deux segments de droite** dont les pentes changent à l'équivalence, quand le réactif titrant cesse d'être consommé ; le volume équivalent se lit à l'intersection des deux droites, ce qui est plus précis que le repérage d'une teinte. Titrer $V = 20{,}0\ \mathrm{mL}$ d'acide chlorhydrique par de la soude à $c_B = 0{,}020\ \mathrm{mol/L}$ avec une équivalence à $V_E = 10{,}0\ \mathrm{mL}$ donne $c_A = \dfrac{c_B V_E}{V} = 0{,}010\ \mathrm{mol/L}$. Quatre pièges : l'absorbance n'a pas d'unité et n'est proportionnelle à la concentration que pour des solutions diluées, en pratique jusqu'à $A \approx 1$ ; il faut mesurer toute la gamme à la même longueur d'onde et dans la même cuve ; une dilution de l'échantillon avant la mesure doit être reportée dans le calcul final ; et la conductivité dépend de la température, si bien que la gamme et l'échantillon doivent être mesurés dans les mêmes conditions.
  en: |
    An **assay by calibration** determines a concentration without consuming the species assayed: a physical quantity proportional to its concentration is measured, then compared with those of a range of solutions of known concentrations. In **spectrophotometry**, that quantity is the **absorbance** $A$, a number without a unit that the instrument computes from the transmitted light intensity. The **Beer-Lambert law** expresses it for a dilute solution of a single coloured species: $A = \varepsilon\,\ell\,C$, where $\ell$ is the length of the cell, in centimetres, $C$ the concentration in $\mathrm{mol/L}$ and $\varepsilon$ the molar absorption coefficient, in $\mathrm{L\cdot mol^{-1}\cdot cm^{-1}}$, which depends on the species, on the solvent and on the wavelength. One works at the wavelength $\lambda_{\max}$ where the species absorbs most, read on its absorption spectrum, because the measurement is most sensitive there and least sensitive to setting errors; the **blank**, a cell of pure solvent, is set first and fixes the zero of absorbance. In **conductimetry**, the measured quantity is the **conductivity** $\sigma$, in $\mathrm{S/m}$ or in $\mathrm{mS/cm}$, the sum of the contributions of all the ions: $\sigma = \sum_i \lambda_i\,[\mathrm{X}_i]$, where $\lambda_i$ is the molar ionic conductivity of the ion $\mathrm{X}_i$. It does not tell the ions apart, but it sees colourless solutions.

    The **calibration line** turns these laws into a measuring instrument. Five or six solutions of known concentrations are prepared by successive dilutions, the quantity is measured for each, the points are plotted and a line through the origin is fitted, whose slope $k$ is then read backwards: $C = A/k$. Example: a range of permanganate ions measured at $\lambda_{\max} = 540\ \mathrm{nm}$ in a cell of $\ell = 1.0\ \mathrm{cm}$ gives the line $A = 2.5\times10^{3}\,C$, with $C$ in $\mathrm{mol/L}$, that is $\varepsilon = 2.5\times10^{3}\ \mathrm{L\cdot mol^{-1}\cdot cm^{-1}}$. A sample whose absorbance is $A = 0.72$ therefore has the concentration $C = \dfrac{0.72}{2.5\times10^{3}} = 2.9\times10^{-4}\ \mathrm{mol/L}$. The quality of the result is read on the alignment of the points, and the uncertainty on the concentration follows from that of the measurement and that of the slope; outside the range of the calibration, extrapolation is not legitimate.

    Conductimetry also serves to **follow a titration**: instead of looking for a change of colour, the conductivity is measured after each addition. Since each ion has its own molar conductivity, the curve $\sigma = f(V)$ is made of **two straight segments** whose slopes change at the equivalence, when the titrant stops being consumed; the equivalence volume is read at the intersection of the two lines, which is more precise than spotting a shade. Titrating $V = 20.0\ \mathrm{mL}$ of hydrochloric acid with sodium hydroxide at $c_B = 0.020\ \mathrm{mol/L}$ with an equivalence at $V_E = 10.0\ \mathrm{mL}$ gives $c_A = \dfrac{c_B V_E}{V} = 0.010\ \mathrm{mol/L}$. Four traps: the absorbance has no unit and is proportional to the concentration only for dilute solutions, in practice up to $A \approx 1$; the whole range must be measured at the same wavelength and in the same cell; a dilution of the sample before the measurement must be carried into the final computation; and the conductivity depends on the temperature, so the range and the sample must be measured under the same conditions.
