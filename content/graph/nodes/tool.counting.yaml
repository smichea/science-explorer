        - "calculer un coefficient binomial, l'interpréter comme un nombre de parties et utiliser la symétrie"
        - "établir et utiliser la relation de Pascal, et lire le triangle de Pascal"
        - "compter les chemins d'un arbre qui réalisent $k$ succès et en déduire une probabilité"
      en:
        - "use the multiplication principle, count $k$-tuples, $k$-tuples of distinct elements and permutations"
        - "compute a binomial coefficient, interpret it as a number of subsets and use the symmetry"
        - "establish and use Pascal's rule, and read Pascal's triangle"
        - "count the paths of a tree that realise $k$ successes and deduce a probability"
