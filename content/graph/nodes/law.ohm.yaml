        - "relever la caractéristique tension-courant d'un dipôle et reconnaître un conducteur ohmique"
        - "utiliser la loi d'Ohm $U = R\\,I$ pour calculer une tension, une intensité ou une résistance"
        - "exploiter les lois des mailles et des nœuds dans un circuit série ou en dérivation, et décrire le principe d'un capteur résistif"
      en:
