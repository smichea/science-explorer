        - "record the voltage–current characteristic of a component and recognise an ohmic conductor"
        - "use Ohm's law $U = R\\,I$ to compute a voltage, a current or a resistance"
        - "use the loop and node laws in a series or parallel circuit, and describe the principle of a resistive sensor"
