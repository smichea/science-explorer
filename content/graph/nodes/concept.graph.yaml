    role: core
    outcomes:
      fr:
        - "tracer et lire la courbe d'une fonction de référence"
        - "lire graphiquement une image, un antécédent, un extremum, une limite"
        - "lire un nombre dérivé comme la pente d'une tangente"
        - "confronter un nuage de points de mesure à une courbe modèle"
      en:
        - "sketch and read the graph of a reference function"
        - "read an image, a preimage, an extremum and a limit from the graph"
        - "read a derivative as the slope of a tangent"
        - "compare a cloud of measured points with a model curve"
