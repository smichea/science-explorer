        - "définir une fonction croissante ou décroissante sur un intervalle par la conservation ou le renversement de l'ordre"
        - "lire et dresser un tableau de variations à partir d'une courbe ou d'une expression simple"
        - "déterminer un maximum ou un minimum, sa valeur et le point où il est atteint"
        - "reconnaître une fonction paire ou impaire par le calcul de f(−x) et par la symétrie de sa courbe"
      en:
        - "define an increasing or decreasing function on an interval by the preservation or reversal of order"
        - "read and draw up a variation table from a curve or from a simple expression"
        - "determine a maximum or a minimum, its value and the point where it is reached"
        - "recognise an even or odd function by computing f(−x) and by the symmetry of its curve"
