id: method.titration
type: method
world: world.chemistry
region: region.chemistry.amount_measurement
importance: 3
tags: [lycee]
title: { fr: "Dosages : par étalonnage (loi de Beer-Lambert) et par titrage direct", en: "Assays: by calibration (Beer–Lambert law) and by direct titration" }
shortPurpose:
  fr: "Déterminer la concentration d'une espèce en solution, soit en comparant une grandeur mesurée, l'absorbance, à une échelle de solutions étalons, soit en la faisant réagir avec une solution titrante jusqu'à l'équivalence."
  en: "Determine the concentration of a species in solution, either by comparing a measured quantity, the absorbance, with a scale of standard solutions, or by making it react with a titrant solution up to the equivalence point."
overview:
  fr: >-
    Doser une espèce, c'est déterminer la quantité qu'en contient une solution. Deux méthodes : mesurer une grandeur qui dépend de la concentration, comme l'absorbance d'une solution colorée, et la comparer à des solutions de concentration connue ; ou faire réagir l'espèce avec un réactif versé goutte à goutte jusqu'à un changement de couleur, l'équivalence, où les deux réactifs ont été introduits dans les proportions de l'équation. C'est le geste fondamental de l'analyse chimique, de l'eau du robinet au contrôle des médicaments.
  en: >-
    Assaying a species means determining how much of it a solution contains. Two methods: measure a quantity that depends on the concentration, such as the absorbance of a coloured solution, and compare it with solutions of known concentration; or make the species react with a reagent poured drop by drop until a colour change, the equivalence point, where the two reactants have been introduced in the proportions of the equation. It is the fundamental gesture of chemical analysis, from tap water to the control of medicines.
aliases:
  fr: ["dosage par étalonnage", "loi de Beer-Lambert", "titrage direct", "équivalence", "spectrophotométrie"]
  en: ["assay by calibration", "Beer–Lambert law", "direct titration", "equivalence point", "spectrophotometry"]
description:
  fr: |
    **Doser** une espèce chimique, c'est déterminer sa quantité de matière ou sa concentration dans une solution. Le **dosage par étalonnage** repose sur la mesure d'une grandeur physique qui dépend de la concentration : pour une espèce colorée, l'**absorbance** $A$ de la solution, mesurée au spectrophotomètre à la longueur d'onde où l'espèce absorbe le plus, la couleur complémentaire de celle de la solution. La **loi de Beer-Lambert** dit que, pour une solution diluée, l'absorbance est proportionnelle à la concentration en quantité de matière : $A = k \times C$, où $k$ dépend de l'espèce, de la longueur d'onde et de la cuve. On mesure $A$ pour une **échelle de solutions étalons** de concentrations connues, on trace la droite d'étalonnage, puis on y lit la concentration de la solution inconnue : avec $k = 0{,}010\ \mathrm{L/mmol}$ et $A = 0{,}35$, on obtient $C = \dfrac{0{,}35}{0{,}010} = 35\ \mathrm{mmol/L}$. Une échelle de teintes est un dosage par étalonnage à l'œil ; le spectrophotomètre remplace l'œil par une mesure.

    Le **titrage direct** utilise une transformation chimique : on fait réagir l'espèce à doser, dans un volume $V_A$ connu de la solution titrée, avec une **solution titrante** de concentration $C_B$ connue, versée progressivement à la burette. La **réaction support de titrage** doit être totale, rapide et unique. À l'**équivalence**, les réactifs ont été introduits dans les proportions stœchiométriques de l'équation : l'espèce titrée et le réactif titrant sont tous deux entièrement consommés, et le volume versé est le **volume équivalent** $V_E$. Le tableau d'avancement donne alors la relation $\dfrac{n_A}{\nu_A} = \dfrac{n_B}{\nu_B}$, soit $\dfrac{C_A V_A}{\nu_A} = \dfrac{C_B V_E}{\nu_B}$. Exemple : $V_A = 10{,}0\ \mathrm{mL}$ d'une solution de diiode sont titrés par du thiosulfate de sodium à $C_B = 0{,}100\ \mathrm{mol/L}$ selon $\mathrm{I_2} + 2\,\mathrm{S_2O_3^{2-}} \to 2\,\mathrm{I^-} + \mathrm{S_4O_6^{2-}}$ ; la teinte brune du diiode disparaît pour $V_E = 10{,}0\ \mathrm{mL}$, d'où $n(\mathrm{I_2}) = \dfrac{C_B V_E}{2} = 5{,}00 \times 10^{-4}\ \mathrm{mol}$ et $C_A = \dfrac{n(\mathrm{I_2})}{V_A} = 5{,}00 \times 10^{-2}\ \mathrm{mol/L}$.

    Avant l'équivalence, le réactif titrant est limitant et disparaît dès qu'il est versé ; après, c'est l'espèce titrée qui est épuisée et le réactif titrant s'accumule : c'est ce changement de réactif limitant que révèle le **suivi colorimétrique**, par la disparition d'une couleur ou la persistance de celle du réactif titrant, le violet du permanganate, parfois à l'aide d'un indicateur coloré. Les deux méthodes se complètent : le dosage par étalonnage ne consomme pas l'échantillon mais demande une échelle et une grandeur mesurable, le titrage consomme l'échantillon mais ne demande qu'une réaction adaptée et une burette. Les pièges classiques : confondre $V_A$ et $V_E$, oublier les nombres stœchiométriques dans la relation à l'équivalence, ou mélanger les millilitres et les litres ; l'incertitude vient surtout du repérage de l'équivalence et de la lecture de la burette. En Terminale, le suivi devient pH-métrique ou conductimétrique.
  en: |
    **Assaying** a chemical species means determining its amount of substance or its concentration in a solution. The **assay by calibration** relies on the measurement of a physical quantity that depends on the concentration: for a coloured species, the **absorbance** $A$ of the solution, measured with a spectrophotometer at the wavelength where the species absorbs the most, the complementary colour of that of the solution. The **Beer–Lambert law** says that, for a dilute solution, the absorbance is proportional to the concentration in amount of substance: $A = k \times C$, where $k$ depends on the species, on the wavelength and on the cell. One measures $A$ for a **scale of standard solutions** of known concentrations, draws the calibration line, then reads on it the concentration of the unknown solution: with $k = 0.010\ \mathrm{L/mmol}$ and $A = 0.35$, one gets $C = \dfrac{0.35}{0.010} = 35\ \mathrm{mmol/L}$. A colour scale is an assay by calibration by eye; the spectrophotometer replaces the eye with a measurement.

    The **direct titration** uses a chemical transformation: the species to be assayed, in a known volume $V_A$ of the titrated solution, is made to react with a **titrant solution** of known concentration $C_B$, poured progressively from a burette. The **titration reaction** must be complete, fast and unique. At the **equivalence point**, the reactants have been introduced in the stoichiometric proportions of the equation: the titrated species and the titrant are both entirely consumed, and the volume poured is the **equivalence volume** $V_E$. The extent table then gives the relation $\dfrac{n_A}{\nu_A} = \dfrac{n_B}{\nu_B}$, that is $\dfrac{C_A V_A}{\nu_A} = \dfrac{C_B V_E}{\nu_B}$. Example: $V_A = 10.0\ \mathrm{mL}$ of a diiodine solution are titrated by sodium thiosulfate at $C_B = 0.100\ \mathrm{mol/L}$ according to $\mathrm{I_2} + 2\,\mathrm{S_2O_3^{2-}} \to 2\,\mathrm{I^-} + \mathrm{S_4O_6^{2-}}$; the brown tint of diiodine disappears for $V_E = 10.0\ \mathrm{mL}$, hence $n(\mathrm{I_2}) = \dfrac{C_B V_E}{2} = 5.00 \times 10^{-4}\ \mathrm{mol}$ and $C_A = \dfrac{n(\mathrm{I_2})}{V_A} = 5.00 \times 10^{-2}\ \mathrm{mol/L}$.

    Before the equivalence point, the titrant is limiting and disappears as soon as it is poured; after it, the titrated species is used up and the titrant accumulates: it is this change of limiting reactant that the **colorimetric monitoring** reveals, by the disappearance of a colour or the persistence of that of the titrant, the purple of permanganate, sometimes with the help of a coloured indicator. The two methods complement each other: the assay by calibration does not consume the sample but requires a scale and a measurable quantity, the titration consumes the sample but only requires a suitable reaction and a burette. The classic traps: confusing $V_A$ and $V_E$, forgetting the stoichiometric coefficients in the relation at the equivalence point, or mixing millilitres and litres; the uncertainty comes mostly from locating the equivalence point and from reading the burette. In Grade 12, the monitoring becomes pH-metric or conductimetric.
depths:
  - depth: 1
    stage: premiere
    role: core
    outcomes:
      fr:
        - "exploiter la loi de Beer-Lambert $A = k \\times C$ et une droite d'étalonnage pour déterminer la concentration d'une espèce colorée par dosage par étalonnage"
        - "identifier la réaction support d'un titrage direct, la solution titrée et la solution titrante, et repérer l'équivalence lors d'un suivi colorimétrique"
        - "établir, à partir du tableau d'avancement, la relation entre les quantités de matière de réactifs introduites à l'équivalence"
        - "déterminer une concentration en quantité de matière à partir du volume équivalent, et comparer dosage par étalonnage et titrage"
      en:
        - "use the Beer–Lambert law $A = k \\times C$ and a calibration line to determine the concentration of a coloured species by an assay by calibration"
        - "identify the titration reaction of a direct titration, the titrated solution and the titrant solution, and locate the equivalence point during a colorimetric monitoring"
        - "establish, from the extent table, the relation between the amounts of reactants introduced at the equivalence point"
        - "determine a concentration in amount of substance from the equivalence volume, and compare an assay by calibration with a titration"
