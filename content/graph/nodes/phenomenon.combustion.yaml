id: phenomenon.combustion
type: phenomenon
world: world.chemistry
region: region.chemistry.thermochemistry
importance: 3
tags: [lycee]
title: { fr: "Combustions : équation, énergie molaire de réaction, énergies de liaison", en: "Combustions: equation, molar reaction energy, bond energies" }
shortPurpose:
  fr: "Écrire l'équation de la combustion complète d'un alcane ou d'un alcool, et estimer l'énergie qu'elle libère à partir des énergies des liaisons rompues et formées."
  en: "Write the equation of the complete combustion of an alkane or an alcohol, and estimate the energy it releases from the energies of the bonds broken and formed."
overview:
  fr: >-
    Brûler du gaz, de l'essence ou du bois, c'est faire réagir un combustible avec le dioxygène de l'air : une réaction d'oxydoréduction qui libère de l'énergie, et dont l'équation s'ajuste carbone, hydrogène, puis oxygène. D'où vient cette énergie ? Rompre des liaisons en coûte, en former en libère, et le bilan pour le méthane est de huit cent deux kilojoules libérés par mole. Cette énergie chauffe nos maisons et propulse nos voitures, avec ses risques, le monoxyde de carbone, l'incendie, et son enjeu, le dioxyde de carbone rejeté.
  en: >-
    Burning gas, petrol or wood means making a fuel react with the oxygen of the air: a redox reaction that releases energy, and whose equation is balanced carbon, hydrogen, then oxygen. Where does this energy come from? Breaking bonds costs some, forming bonds releases some, and the balance for methane is eight hundred and two kilojoules released per mole. This energy heats our homes and drives our cars, with its risks, carbon monoxide and fire, and its stake, the carbon dioxide released.
aliases:
  fr: ["combustion complète", "combustible et comburant", "énergie molaire de réaction", "énergie de liaison", "réaction exothermique"]
  en: ["complete combustion", "fuel and oxidiser", "molar reaction energy", "bond energy", "exothermic reaction"]
description:
  fr: |
    Une **combustion** est la réaction d'un **combustible** (alcane, alcool, bois, charbon, dihydrogène) avec un **comburant**, presque toujours le dioxygène de l'air ; c'est une réaction d'oxydoréduction, le dioxygène étant l'oxydant et le combustible le réducteur, et elle est **exothermique**. Elle demande un apport d'énergie initial, une flamme ou une étincelle, puis s'entretient elle-même ; combustible, comburant et énergie d'activation forment le **triangle du feu**, et supprimer l'un des trois éteint la combustion. La **combustion complète** d'un alcane ou d'un alcool ne produit que du dioxyde de carbone et de l'eau : $\mathrm{CH_4} + 2\,\mathrm{O_2} \to \mathrm{CO_2} + 2\,\mathrm{H_2O}$, $\mathrm{C_3H_8} + 5\,\mathrm{O_2} \to 3\,\mathrm{CO_2} + 4\,\mathrm{H_2O}$, $\mathrm{C_2H_5OH} + 3\,\mathrm{O_2} \to 2\,\mathrm{CO_2} + 3\,\mathrm{H_2O}$ ; on ajuste le carbone, puis l'hydrogène, puis le dioxygène. Quand le dioxygène manque, la **combustion incomplète** produit aussi du monoxyde de carbone $\mathrm{CO}$, gaz toxique, et du carbone, la suie.

    L'**énergie molaire de réaction** $E_r$ est l'énergie échangée avec l'extérieur quand la réaction se produit une fois telle qu'elle est écrite, c'est-à-dire pour un avancement d'une mole ; elle s'exprime en $\mathrm{kJ/mol}$ et elle est négative pour une réaction exothermique. En phase gazeuse, on l'estime à partir des **énergies de liaison** : l'énergie de liaison $E_l$ est l'énergie nécessaire pour rompre une mole d'une liaison, toujours positive ; rompre des liaisons coûte de l'énergie, en former en libère. Ainsi $E_r = \sum E_l(\text{liaisons rompues}) - \sum E_l(\text{liaisons formées})$. Pour le méthane, on rompt quatre liaisons $\mathrm{C{-}H}$ ($413\ \mathrm{kJ/mol}$) et deux liaisons $\mathrm{O{=}O}$ ($498\ \mathrm{kJ/mol}$), on forme deux liaisons $\mathrm{C{=}O}$ ($799\ \mathrm{kJ/mol}$) et quatre liaisons $\mathrm{O{-}H}$ ($463\ \mathrm{kJ/mol}$) : $E_r = (4 \times 413 + 2 \times 498) - (2 \times 799 + 4 \times 463) = 2648 - 3450 = -802\ \mathrm{kJ/mol}$. La combustion libère de l'énergie parce que les liaisons formées sont, au total, plus fortes que celles qui sont rompues. L'énergie libérée par une quantité $n$ de combustible vaut $E = n \times |E_r|$ : brûler $1{,}0\ \mathrm{kg}$ de méthane, soit $62{,}5\ \mathrm{mol}$, libère $5{,}0 \times 10^{4}\ \mathrm{kJ}$, environ $50\ \mathrm{MJ}$.

    Les combustions fournissent l'essentiel de l'énergie utilisée par l'humanité : chauffage, cuisson, moteurs thermiques, centrales, fusées. On mesure l'énergie qu'elles libèrent par calorimétrie, en chauffant une masse d'eau avec la flamme d'un alcool et en exploitant $E = m\,c\,\Delta T$. Leurs risques sont l'incendie, l'explosion des mélanges de gaz et d'air, et l'intoxication au monoxyde de carbone d'une combustion incomplète, gaz invisible et inodore. Leur enjeu majeur est le dioxyde de carbone rejeté, gaz à effet de serre : le bilan carbone d'un combustible compare l'énergie libérée à la masse de $\mathrm{CO_2}$ émise, ce qui favorise le méthane par rapport au charbon et fait du dihydrogène, dont la combustion $2\,\mathrm{H_2} + \mathrm{O_2} \to 2\,\mathrm{H_2O}$ n'émet pas de carbone, une piste étudiée. L'estimation par les énergies de liaison suppose des réactifs et des produits gazeux et des énergies de liaison moyennes : pour de l'eau liquide, l'énergie libérée est un peu plus grande.
  en: |
    A **combustion** is the reaction of a **fuel** (alkane, alcohol, wood, coal, dihydrogen) with an **oxidiser**, almost always the oxygen of the air; it is a redox reaction, oxygen being the oxidant and the fuel the reductant, and it is **exothermic**. It requires an initial input of energy, a flame or a spark, then sustains itself; fuel, oxidiser and activation energy form the **fire triangle**, and removing one of the three extinguishes the combustion. The **complete combustion** of an alkane or an alcohol produces only carbon dioxide and water: $\mathrm{CH_4} + 2\,\mathrm{O_2} \to \mathrm{CO_2} + 2\,\mathrm{H_2O}$, $\mathrm{C_3H_8} + 5\,\mathrm{O_2} \to 3\,\mathrm{CO_2} + 4\,\mathrm{H_2O}$, $\mathrm{C_2H_5OH} + 3\,\mathrm{O_2} \to 2\,\mathrm{CO_2} + 3\,\mathrm{H_2O}$; carbon is balanced first, then hydrogen, then oxygen. When oxygen is lacking, the **incomplete combustion** also produces carbon monoxide $\mathrm{CO}$, a toxic gas, and carbon, soot.

    The **molar reaction energy** $E_r$ is the energy exchanged with the surroundings when the reaction takes place once as written, that is for an extent of one mole; it is expressed in $\mathrm{kJ/mol}$ and it is negative for an exothermic reaction. In the gas phase, it is estimated from the **bond energies**: the bond energy $E_l$ is the energy needed to break one mole of a bond, always positive; breaking bonds costs energy, forming them releases some. Thus $E_r = \sum E_l(\text{bonds broken}) - \sum E_l(\text{bonds formed})$. For methane, four $\mathrm{C{-}H}$ bonds ($413\ \mathrm{kJ/mol}$) and two $\mathrm{O{=}O}$ bonds ($498\ \mathrm{kJ/mol}$) are broken, two $\mathrm{C{=}O}$ bonds ($799\ \mathrm{kJ/mol}$) and four $\mathrm{O{-}H}$ bonds ($463\ \mathrm{kJ/mol}$) are formed: $E_r = (4 \times 413 + 2 \times 498) - (2 \times 799 + 4 \times 463) = 2648 - 3450 = -802\ \mathrm{kJ/mol}$. The combustion releases energy because the bonds formed are, overall, stronger than those broken. The energy released by an amount $n$ of fuel is $E = n \times |E_r|$: burning $1.0\ \mathrm{kg}$ of methane, that is $62.5\ \mathrm{mol}$, releases $5.0 \times 10^{4}\ \mathrm{kJ}$, about $50\ \mathrm{MJ}$.

    Combustions provide most of the energy used by humanity: heating, cooking, heat engines, power stations, rockets. The energy they release is measured by calorimetry, by heating a mass of water with the flame of an alcohol and using $E = m\,c\,\Delta T$. Their risks are fire, the explosion of gas–air mixtures, and poisoning by the carbon monoxide of an incomplete combustion, an invisible and odourless gas. Their major stake is the carbon dioxide released, a greenhouse gas: the carbon footprint of a fuel compares the energy released with the mass of $\mathrm{CO_2}$ emitted, which favours methane over coal and makes dihydrogen, whose combustion $2\,\mathrm{H_2} + \mathrm{O_2} \to 2\,\mathrm{H_2O}$ emits no carbon, a path under study. The estimate from bond energies assumes gaseous reactants and products and average bond energies: for liquid water, the energy released is slightly larger.
