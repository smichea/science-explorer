    role: core
    outcomes:
      fr:
        - "situer un nombre dans les ensembles ℕ, ℤ, 𝔻, ℚ, ℝ et justifier qu'un rationnel n'est pas décimal ou qu'un réel n'est pas rationnel"
        - "représenter un intervalle sur la droite numérique et traduire une inégalité par un intervalle, et réciproquement"
        - "interpréter |x − a| comme une distance et résoudre une inéquation de la forme |x − a| ≤ r"
        - "encadrer un nombre, donner une valeur approchée ou un arrondi à une précision donnée"
      en:
