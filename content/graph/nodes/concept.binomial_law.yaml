    role: core
    outcomes:
      fr:
        - "reconnaître un schéma de Bernoulli et justifier l'indépendance et l'identité des épreuves"
        - "calculer $P(X = k)$, $P(X \\leqslant k)$ et $P(X \\geqslant k)$ pour une loi binomiale, à la main ou à la calculatrice"
        - "utiliser $E(X) = np$ et $V(X) = np(1-p)$, et interpréter l'espérance comme une prévision moyenne"
        - "modéliser une situation de contrôle, de sondage ou de répétition par une loi binomiale et discuter le résultat"
      en:
        - "recognise a Bernoulli scheme and justify the independence and the identity of the trials"
        - "compute $P(X = k)$, $P(X \\leqslant k)$ and $P(X \\geqslant k)$ for a binomial law, by hand or with a calculator"
        - "use $E(X) = np$ and $V(X) = np(1-p)$, and interpret the expectation as an average prediction"
        - "model a situation of quality control, polling or repetition by a binomial law and discuss the result"
