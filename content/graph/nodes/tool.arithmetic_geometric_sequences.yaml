        - "calculer la somme 1 + 2 + … + n et la somme 1 + q + … + q^n"
        - "modéliser une évolution à taux constant par une suite géométrique et comparer croissance linéaire et croissance exponentielle"
      en:
        - "recognise an arithmetic or geometric sequence in a statement and give its common difference or ratio"
        - "compute the term of rank n with u(n) = u(0) + n r or u(n) = u(0) q^n, and determine the direction of variation"
        - "compute the sum 1 + 2 + … + n and the sum 1 + q + … + q^n"
        - "model an evolution at a constant rate by a geometric sequence and compare linear with exponential growth"
