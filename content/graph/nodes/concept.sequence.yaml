    stage: premiere
    role: core
    outcomes:
      fr:
        - "modéliser une situation par une suite et distinguer le rang n du terme u(n)"
        - "calculer les termes d'une suite définie explicitement par u(n) = f(n) ou par récurrence par u(n+1) = f(u(n))"
        - "étudier le sens de variation d'une suite avec le signe de u(n+1) − u(n), ou le quotient pour une suite positive"
        - "représenter une suite par le nuage de points (n ; u(n)) et lire son comportement sur le graphique"
      en:
        - "model a situation by a sequence and distinguish the rank n from the term u(n)"
        - "compute the terms of a sequence defined explicitly by u(n) = f(n) or recursively by u(n+1) = f(u(n))"
        - "study the direction of variation of a sequence with the sign of u(n+1) − u(n), or the quotient for a positive sequence"
        - "represent a sequence by the cloud of points (n ; u(n)) and read its behaviour on the graph"
