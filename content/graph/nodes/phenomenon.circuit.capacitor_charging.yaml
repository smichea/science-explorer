        - "prévoir la réponse à un signal créneau selon le rapport entre période et constante de temps"
      en:
        - "handle the response of an RC circuit to a voltage step with arbitrary initial conditions and the continuity of $u_C$"
        - "carry out the energy balance of the charge: stored energy $\\tfrac12 C E^2$, energy dissipated in $R$"
        - "generalise to the RL circuit and to any first-order system (characteristic time, free and forced regimes)"
        - "predict the response to a square signal according to the ratio between period and time constant"
