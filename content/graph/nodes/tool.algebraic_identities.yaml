overview:
  fr: >-
    Le calcul littéral manipule des expressions où des lettres tiennent la place de nombres quelconques. Développer transforme un produit en somme, factoriser fait le chemin inverse, et trois identités remarquables accélèrent les deux. Choisir la bonne forme, développée pour calculer, factorisée pour résoudre, est le geste central de toute l'algèbre du lycée.
  en: >-
    Algebraic manipulation handles expressions in which letters stand for arbitrary numbers. Expanding turns a product into a sum, factoring goes the other way, and three remarkable identities speed up both. Choosing the right form, expanded to compute, factored to solve, is the central gesture of all lycée algebra.
