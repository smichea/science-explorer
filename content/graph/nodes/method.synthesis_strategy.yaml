      fr:
        - "identifier, dans une molécule, les groupes caractéristiques et les sites susceptibles de réagir avec un réactif donné"
        - "justifier le recours à un réactif sélectif, ou à la protection puis à la déprotection d'un groupe caractéristique, dans une synthèse multi-étapes"
