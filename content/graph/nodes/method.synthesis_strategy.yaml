        - "justify the use of a selective reagent, or of the protection and then deprotection of a characteristic group, in a multi-step synthesis"
        - "compute the yield of one step from the amount obtained and the maximum amount, and the overall yield as the product of the yields"
        - "compare two synthesis strategies by the number of steps, the overall yield, the selectivity, the cost and the environmental impact"
