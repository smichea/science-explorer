    outcomes:
      fr:
        - "décrire une expérience aléatoire par son univers et modéliser un événement comme un ensemble d'issues"
        - "calculer la probabilité d'un événement contraire, d'une intersection et d'une réunion avec P(A ∪ B) = P(A) + P(B) − P(A ∩ B)"
        - "reconnaître une situation d'équiprobabilité et calculer une probabilité par dénombrement (tableau, arbre)"
        - "distinguer probabilité théorique et fréquence observée sur un grand nombre de répétitions"
      en:
        - "describe a random experiment by its sample space and model an event as a set of outcomes"
        - "compute the probability of a complementary event, of an intersection and of a union with P(A ∪ B) = P(A) + P(B) − P(A ∩ B)"
        - "recognise an equiprobable situation and compute a probability by counting (table, tree)"
        - "distinguish theoretical probability from the frequency observed over a large number of repetitions"
