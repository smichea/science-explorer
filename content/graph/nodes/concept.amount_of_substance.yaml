      fr:
        - "définir la quantité de matière comme un nombre d'entités divisé par la constante d'Avogadro et convertir un nombre d'entités en moles"
        - "calculer la masse d'une entité ou la masse molaire d'une espèce à partir des masses des atomes"
        - "déterminer la quantité de matière d'un échantillon à partir de sa masse et de la masse molaire de l'espèce"
        - "utiliser la mole pour relier l'échelle macroscopique et l'échelle microscopique, en contrôlant les unités"
      en:
