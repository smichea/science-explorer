      fr:
        - "modéliser une lunette afocale par deux lentilles minces convergentes et placer les foyers sur un schéma"
        - "construire l'image intermédiaire d'un objet à l'infini dans le plan focal de l'objectif"
        - "établir et exploiter le grossissement $G = \\theta'/\\theta = f'_1/f'_2$ d'une lunette afocale"
        - "relier la longueur de la lunette aux deux distances focales et discuter le choix d'un oculaire"
      en:
        - "model an afocal telescope by two thin converging lenses and place the foci on a diagram"
        - "construct the intermediate image of an object at infinity in the focal plane of the objective"
        - "establish and use the magnification $G = \\theta'/\\theta = f'_1/f'_2$ of an afocal telescope"
        - "relate the length of the telescope to the two focal lengths and discuss the choice of an eyepiece"
