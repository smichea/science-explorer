    stage: terminale
    role: core
    outcomes:
      fr:
        - "déterminer la limite d'une fonction en $+\\infty$, en $-\\infty$ et en un point, à partir des limites de référence"
        - "lever une forme indéterminée en factorisant le terme dominant ou en utilisant l'expression conjuguée"
        - "interpréter une limite en termes d'asymptote horizontale ou verticale et l'exploiter pour tracer la courbe"
        - "utiliser les croissances comparées de l'exponentielle et des puissances"
      en:
        - "determine the limit of a function at $+\\infty$, at $-\\infty$ and at a point, from the reference limits"
        - "settle an indeterminate form by factoring out the dominant term or by using the conjugate expression"
        - "interpret a limit as a horizontal or vertical asymptote and use it to draw the curve"
        - "use the comparative growth of the exponential and of the powers"
