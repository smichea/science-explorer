shortPurpose:
  fr: "Ami vénitien de Galilée, destinataire de la lettre de 1604 sur la loi de la chute."
  en: "Galileo's Venetian friend, recipient of the 1604 letter on the law of fall."
overview:
  fr: >-
    Paolo Sarpi, théologien et savant vénitien, ami et correspondant de Galilée. La lettre que Galilée lui adresse en octobre mille six cent quatre contient la première formulation de la loi de la chute, avec une hypothèse fausse sur la vitesse. Un témoin précieux de la science en train de se faire.
  en: >-
    Paolo Sarpi, Venetian theologian and scholar, friend and correspondent of Galileo. The letter Galileo sent him in October sixteen hundred and four contains the first statement of the law of fall, with a wrong hypothesis about speed. A precious witness of science in the making.
