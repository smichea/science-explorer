quotations:
  - id: quotation.galileo.letter_sarpi.1604
    source: source.galileo.letter_sarpi.1604
    originalLanguage: it
    fr: "Galilée écrit à Sarpi qu'il a trouvé une proposition qu'il juge naturelle et évidente, d'où il démontre que les espaces parcourus par un corps en chute naturelle sont entre eux comme les carrés des temps, et donc que les espaces parcourus en des temps égaux sont comme les nombres impairs à partir de l'unité. Ce principe, ajoute-t-il, est que le mobile gagne de la vitesse dans la proportion où il s'éloigne du point de départ de son mouvement."
    en: "Galileo writes to Sarpi that he has found a proposition he judges natural and evident, from which he demonstrates that the spaces passed by a naturally falling body are to one another as the squares of the times, and hence that the spaces passed in equal times are as the odd numbers from unity. That principle, he adds, is that the moving body gains speed in the proportion in which it moves away from the starting point of its motion."
    translationStatus: paraphrase
    confidence: high
    context:
      fr: "Lettre du 16 octobre 1604 : Galilée y annonce la loi des carrés des temps et la fonde sur l'hypothèse, erronée, d'une vitesse proportionnelle à la distance parcourue. Paraphrase des auteurs, sans citation textuelle."
      en: "Letter of 16 October 1604: Galileo announces the times-squared law and rests it on the incorrect assumption that speed is proportional to the distance fallen. Authors' paraphrase, not a verbatim quotation."
  - id: quotation.galileo.discorsi.inclined_plane
    source: source.galileo.discorsi.crew_desalvio.1914
    originalLanguage: it
    fr: "On prit une pièce de bois moulurée, ou chevron, longue d'environ douze coudées, large d'une demi-coudée et épaisse de trois doigts ; sur son arête, on creusa un canal d'un peu plus d'un doigt de large ; après avoir rendu cette rainure très droite, lisse et polie, et l'avoir tapissée d'un parchemin lui aussi le plus lisse et poli possible, nous y fîmes rouler une boule de bronze dure, lisse et très ronde. Ayant placé cette planche en pente, en soulevant l'une de ses extrémités d'une ou deux coudées au-dessus de l'autre, nous fîmes rouler la boule, comme je le disais, le long du canal, en notant, de la manière que je décrirai bientôt, le temps nécessaire à la descente."
    en: "A piece of wooden moulding or scantling, about 12 cubits long, half a cubit wide, and three finger-breadths thick, was taken; on its edge was cut a channel a little more than one finger in breadth; having made this groove very straight, smooth, and polished, and having lined it with parchment, also as smooth and polished as possible, we rolled along it a hard, smooth, and very round bronze ball. Having placed this board in a sloping position, by lifting one end some one or two cubits above the other, we rolled the ball, as I was just saying, along the channel, noting, in a manner presently to be described, the time required to make the descent."
    translationStatus: published_translation
    confidence: high
    context:
      fr: "Troisième Journée des Discorsi, mouvement naturellement accéléré : Salviati décrit l'appareil ayant servi à vérifier la loi des nombres impairs sur un plan incliné. Le texte anglais est la traduction publiée de Crew et de Salvio (1914) ; la version française est une traduction des auteurs établie d'après cette version anglaise (les braccia de Galilée y sont rendues par « coudées »)."
      en: "Third Day of the Discorsi, naturally accelerated motion: Salviati describes the apparatus used to test the odd-number law on an inclined plane. The English is the published Crew and de Salvio translation (1914); the French is the authors' own translation made from that English version (Galileo's braccia appear as 'cubits')."
