      status: attested
      sources: [source.drake.1978]
    - id: boarders
      claim:
        fr: "À Padoue, Galilée logeait et instruisait des étudiants dans sa maison pour compléter ses revenus."
        en: "In Padua, Galileo lodged and tutored students in his house to supplement his income."
      status: attested
      sources: [source.drake.1978]
    - id: sarpi_letter
      claim:
        fr: "Dans sa lettre à Paolo Sarpi du 16 octobre 1604, Galilée affirme que les espaces parcourus sont comme les carrés des temps et le déduit d'un principe erroné : la vitesse serait proportionnelle à la distance parcourue."
        en: "In his letter to Paolo Sarpi of 16 October 1604, Galileo states that the spaces passed are as the squares of the times and derives it from a mistaken principle: that speed is proportional to the distance covered."
      status: attested
      sources: [source.galileo.letter_sarpi.1604]
    - id: settle_replication
      claim:
        fr: "La réplication de Thomas Settle (1961), avec un dispositif conforme aux Discorsi, montre que l'expérience était réalisable avec la précision revendiquée par Galilée."
        en: "Thomas Settle's replication (1961), with apparatus matching the Discorsi, shows that the experiment was feasible with the precision Galileo claimed."
      status: scholarly_interpretation
      sources: [source.settle.1961]

