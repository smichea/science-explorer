# Mission: Galileo in Padua — the inclined plane (vertical slice, tool introduced: the derivative).
# Historical status of the scenario: place, actor, apparatus and documents are attested; the learner's
# role and every dialogue line are labelled fiction / reconstruction (see historicalContext.claims and
# the per-step historicalClaims). Locators to verify before `status: published` are flagged "à vérifier".
id: mission.galileo.inclined_plane
status: review
version: 1
title:
  fr: "Galilée à Padoue : le plan incliné"
  en: "Galileo in Padua: the inclined plane"
summary:
  fr: |
    Padoue, vers 1604. Dans la maison de Galilée, une bille de bronze descend une rainure de bois pendant
    qu'une horloge à eau compte le temps. Comment la vitesse de la bille change-t-elle pendant la descente ?
    Pour répondre, il faudra mesurer, tracer, puis construire un outil que Galilée n'avait pas : la dérivée.
    Le même outil servira ensuite à décrire la charge d'un condensateur et une réaction chimique.
  en: |
    Padua, c. 1604. In Galileo's house a bronze ball rolls down a wooden groove while a water clock counts
    the time. How does the speed of the ball change during the descent? To answer, you will measure, plot,
    and then build a tool Galileo did not have: the derivative. The same tool will then describe the
    charging of a capacitor and a chemical reaction.
role:
  fr: |
    Vous êtes un jeune pensionnaire logé chez Galilée, chargé de tenir l'horloge à eau pendant les descentes
    de la bille. **Ce rôle est une fiction pédagogique** : Galilée hébergeait bien des étudiants dans sa maison
    de Padoue, mais aucun document ne décrit un tel assistant ni les scènes racontées ici.
  en: |
    You are a young boarder lodging in Galileo's house, in charge of the water clock during the descents of
    the ball. **This role is a pedagogical fiction**: Galileo did lodge students in his Padua house, but no
    document describes such an assistant or the scenes told here.
anchorNode: phenomenon.motion.inclined_plane
importance: 3

historicalContext:
  places: [place.padua]
  date:
    certainty: interval
    from: "1602"
    to: "1608"
    display: { fr: "vers 1604", en: "c. 1604" }
    note:
      fr: "Les expériences sont datées d'après les feuillets de travail manuscrits et la lettre à Sarpi d'octobre 1604 ; le récit publié est celui des Discorsi de 1638."
      en: "The experiments are dated from the working manuscripts and the October 1604 letter to Sarpi; the published account is the Discorsi of 1638."
  people: [person.galileo_galilei, person.paolo_sarpi]
  evidenceSummary:
    fr: |
      Ce que nous savons vient de trois couches de documents. La lettre de Galilée à Paolo Sarpi du 16 octobre
      1604 énonce la loi des carrés des temps, mais la déduit d'une hypothèse fausse (vitesse proportionnelle à
      la distance parcourue). Les feuillets de travail conservés à Florence (manuscrit 72) contiennent des
      mesures et des calculs que les historiens datent des années 1604–1608. Le dispositif — rainure de bois,
      bille de bronze, temps mesuré en pesant l'eau écoulée — n'est décrit qu'en 1638, dans la Troisième
      Journée des *Discorsi*. Le scénario de cette mission est une reconstruction pédagogique appuyée sur ces
      documents ; le rôle du pensionnaire et les dialogues sont des fictions et sont signalés comme telles.
    en: |
      What we know comes from three layers of documents. Galileo's letter to Paolo Sarpi of 16 October 1604
      states the times-squared law but derives it from a false hypothesis (speed proportional to the distance
      covered). The working folios kept in Florence (manuscript 72) contain measurements and calculations that
      historians date to the years 1604–1608. The apparatus — wooden groove, bronze ball, time measured by
      weighing the water that flowed out — is described only in 1638, in the Third Day of the *Discorsi*. The
      scenario of this mission is a pedagogical reconstruction built on these documents; the boarder's role
      and the dialogues are fiction and are labelled as such.
  sources: [source.galileo.discorsi.1638, source.galileo.letter_sarpi.1604, source.drake.1978, source.settle.1961]
