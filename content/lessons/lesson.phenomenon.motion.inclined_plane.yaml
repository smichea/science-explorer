# Leçon à outil simulation : les diapositives sont composées depuis la description du nœud.
id: lesson.phenomenon.motion.inclined_plane
nodeId: phenomenon.motion.inclined_plane
depth: 1
tools:
  - id: simulation
    kind: simulation
    simulationId: simulation.galileo.inclined_plane
  - id: forces
    kind: vectors
    title: { fr: "Forces sur le plan", en: "Forces on the plane" }
    view: { x: [-2, 12], y: [-12, 2] }
    parameters:
      - { id: t, label: { fr: "angle θ (°)", en: "angle θ (°)" }, min: 5, max: 60, step: 1, value: 20 }
    paths:
      - { id: slope, x: "s", y: "-s*sin(t*pi/180)/cos(t*pi/180)", range: [0, 11], label: { fr: "plan incliné", en: "inclined plane" } }
    vectors:
      - { id: weight, x: 0, y: -9.8, label: { fr: "poids P (m = 1 kg)", en: "weight P (m = 1 kg)" }, color: "#ffb347" }
      - { id: tangent, x: "9.8*sin(t*pi/180)*cos(t*pi/180)", y: "-9.8*sin(t*pi/180)^2", label: { fr: "composante le long du plan", en: "component along the plane" }, color: "#5ee6a8" }
      - { id: normal, x: "-9.8*sin(t*pi/180)*cos(t*pi/180)", y: "-9.8*cos(t*pi/180)^2", label: { fr: "composante normale", en: "normal component" }, color: "#b39dff" }
