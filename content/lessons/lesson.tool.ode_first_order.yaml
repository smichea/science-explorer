# Leçon narrée — l'équation différentielle du premier ordre, avec le champ de pentes.
id: lesson.tool.ode_first_order
nodeId: tool.ode_first_order
depth: 1
tools:
  - id: field
    kind: slope_field
    view: { x: [-1, 3], y: [-1, 6] }
    parameters:
      - { id: k, label: { fr: "coefficient k", en: "coefficient k" }, min: -1.5, max: 1.5, step: 0.1, value: 0.7 }
    equation: "k*y"
    solutions:
      - { id: s1, x0: 0, y0: 1, label: { fr: "y(0) = 1", en: "y(0) = 1" }, hidden: true }
      - { id: s2, x0: 0, y0: 2, label: { fr: "y(0) = 2", en: "y(0) = 2" }, hidden: true }
      - { id: s3, x0: 0, y0: -0.5, label: { fr: "y(0) = −0,5", en: "y(0) = −0.5" }, hidden: true }
steps:
  - id: equation
    title: { fr: "Une équation sur la dérivée", en: "An equation on the derivative" }
    text:
      fr: >-
        Une équation différentielle relie une fonction inconnue y à sa dérivée y prime.
        La plus simple du premier ordre dit : y prime égale k fois y, la vitesse de variation est proportionnelle à la valeur.
        Le champ de pentes montre, en chaque point, la pente que doit avoir la courbe qui y passe.
      en: >-
        A differential equation links an unknown function y to its derivative y prime.
        The simplest first-order one says: y prime equals k times y, the rate of change is proportional to the value.
        The slope field shows, at every point, the slope the curve through it must have.
    actions: []
  - id: solution
    title: { fr: "Une solution suit les pentes", en: "A solution follows the slopes" }
    text:
      fr: >-
        Une solution est une courbe qui suit les pentes du champ en chaque point.
        Partons de y égale 1 en zéro : la courbe monte de plus en plus vite.
        C'est une exponentielle, exp de k x.
      en: >-
        A solution is a curve that follows the slopes of the field at every point.
        Let us start from y equal to 1 at zero: the curve rises faster and faster.
        It is an exponential, exp of k x.
    actions:
      - { at: 1, show: [s1] }
  - id: family
    title: { fr: "Une famille de solutions", en: "A family of solutions" }
    text:
      fr: >-
        Il n'y a pas une solution mais une famille : une par valeur de départ.
        En partant de 2, on obtient une courbe deux fois plus haute.
        En partant d'une valeur négative, la courbe descend.
        La condition initiale choisit la solution.
      en: >-
        There is not one solution but a family: one per starting value.
        Starting from 2, we get a curve twice as high.
        Starting from a negative value, the curve goes down.
        The initial condition picks the solution.
    actions:
      - { at: 1, show: [s2] }
      - { at: 2, show: [s3] }
  - id: play
    kind: play
    title: { fr: "À vous de poser une condition initiale", en: "Your turn to set an initial condition" }
    text:
      fr: >-
        À vous. Cliquez dans le champ pour poser une condition initiale, et faites varier k : k positif fait croître, k négatif fait décroître vers zéro.
      en: >-
        Your turn. Click in the field to set an initial condition, and vary k: a positive k makes the solution grow, a negative k makes it decay towards zero.
    actions: []
  - id: exercises
    kind: exercises
    title: { fr: "Exercices", en: "Exercises" }
    text:
      fr: >-
        Deux exercices : écrire la solution d'une équation, puis calculer une valeur.
        Saisissez vos réponses ; un indice est disponible si vous bloquez.
      en: >-
        Two exercises: write the solution of an equation, then compute a value.
        Type your answers; a hint is available if you get stuck.
    exercises: [exercise.ode.solution, exercise.ode.value]
