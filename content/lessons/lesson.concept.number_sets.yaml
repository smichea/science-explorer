# Leçon — ensembles de nombres, intervalles et valeur absolue : le traceur montre |x − a| et un intervalle sur l'axe.
id: lesson.concept.number_sets
nodeId: concept.number_sets
depth: 1
tools:
  - id: plotter
    kind: plotter
    variable: x
    view: { x: [-6, 6], y: [-1, 6] }
    parameters:
      - { id: a, label: { fr: "centre a", en: "centre a" }, min: -5, max: 5, step: 0.1, value: 2 }
    input: true
    initial:
      - { plot: { id: d, expr: "abs(x-a)", label: { fr: "|x − a|", en: "|x − a|" } } }
      - { point: { id: p, on: d, x: "a+3", guides: true, label: { fr: "distance 3", en: "distance 3" } } }
      - { interval: { id: i, from: -2, to: 3, label: { fr: "[−2 ; 3]", en: "[−2, 3]" } } }
