# Leçon à outil simulation : les diapositives sont composées depuis la description du nœud.
id: lesson.phenomenon.chemistry.first_order_reaction
nodeId: phenomenon.chemistry.first_order_reaction
depth: 1
tools:
  - id: simulation
    kind: simulation
    simulationId: simulation.kinetics.first_order
  - id: field
    kind: slope_field
    title: { fr: "Équation cinétique", en: "Rate equation" }
    view: { x: [0, 30], y: [0, 1.2] }
    parameters:
      - { id: k, label: { fr: "constante k (s⁻¹)", en: "rate constant k (s⁻¹)" }, min: 0.02, max: 0.4, step: 0.01, value: 0.1 }
    equation: "-k*y"
    labels: { x: "t (s)", y: "[A] (mol/L)" }
    solutions:
      - { id: one, x0: 0, y0: 1, label: { fr: "[A]₀ = 1", en: "[A]₀ = 1" } }
