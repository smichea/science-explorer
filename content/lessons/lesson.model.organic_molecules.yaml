steps:
  - id: skeleton
    title: { fr: "Le squelette carboné et le premier groupe", en: "The carbon skeleton and the first group" }
    tool: ethanol
    text:
      fr: >-
        Une molécule organique est bâtie sur un squelette carboné, un enchaînement d'atomes de carbone tétravalents, chacun formant quatre liaisons.
        On la décrit par sa formule brute, qui compte les atomes, ici deux carbones, six hydrogènes et un oxygène, ou par sa formule semi-développée, qui montre les liaisons entre atomes lourds.
        Les alcanes n'ont que des carbones et des hydrogènes, et leur nom dit la longueur de la chaîne : méthane, éthane, propane, butane, pentane, hexane.
        Ajoutons un groupe caractéristique, ici le groupe hydroxyle porté par un carbone saturé, et la molécule devient un alcool, l'éthanol, dont le nom se termine par le suffixe ol.
      en: >-
        An organic molecule is built on a carbon skeleton, a chain of tetravalent carbon atoms, each forming four bonds.
        It is described by its molecular formula, which counts the atoms, here two carbons, six hydrogens and one oxygen, or by its condensed structural formula, which shows the bonds between the heavy atoms.
        Alkanes have only carbons and hydrogens, and their name states the length of the chain: methane, ethane, propane, butane, pentane, hexane.
        Let us add a characteristic group, here the hydroxyl group carried by a saturated carbon, and the molecule becomes an alcohol, ethanol, whose name ends with the suffix ol.
    actions:
      - { at: 3, show: [hydroxyl] }
  - id: ketone
    title: { fr: "Le carbonyle au milieu de la chaîne : une cétone", en: "The carbonyl inside the chain: a ketone" }
    tool: propanone
    text:
      fr: >-
        Le groupe carbonyle est une double liaison entre un atome de carbone et un atome d'oxygène.
        Quand ce carbone se trouve à l'intérieur de la chaîne, encadré par deux autres carbones, la molécule est une cétone.
        La propanone, l'acétone des dissolvants, en est la plus simple : trois carbones, le carbonyle au milieu.
        Le nom se termine par le suffixe one, précédé si nécessaire du numéro du carbone qui porte le groupe, comme dans la butan-2-one.
      en: >-
        The carbonyl group is a double bond between a carbon atom and an oxygen atom.
        When this carbon lies inside the chain, framed by two other carbons, the molecule is a ketone.
        Propanone, the acetone of solvents, is the simplest of them: three carbons, the carbonyl in the middle.
        The name ends with the suffix one, preceded where needed by the number of the carbon carrying the group, as in butan-2-one.
    actions:
      - { at: 1, show: [carbonyl] }
  - id: aldehyde
    title: { fr: "Le même groupe en bout de chaîne : un aldéhyde", en: "The same group at the end of the chain: an aldehyde" }
    tool: ethanal
    text:
      fr: >-
        Déplaçons maintenant le groupe carbonyle en bout de chaîne : le carbone y porte encore un atome d'hydrogène.
        Le groupe s'écrit alors CHO et la molécule est un aldéhyde, non plus une cétone.
        Voici l'éthanal, deux carbones, dont le nom se termine par le suffixe al.
        Un même groupe donne donc deux familles selon sa position sur le squelette : c'est le piège classique de la chimie organique.
      en: >-
        Let us now move the carbonyl group to the end of the chain: the carbon there still carries a hydrogen atom.
        The group is then written CHO and the molecule is an aldehyde, no longer a ketone.
        Here is ethanal, two carbons, whose name ends with the suffix al.
        One and the same group therefore gives two families depending on its position on the skeleton: this is the classic trap of organic chemistry.
    actions:
      - { at: 1, show: [carbonyl] }
  - id: acid
    title: { fr: "Le groupe carboxyle, et les isomères", en: "The carboxyl group, and isomers" }
    tool: acid
    text:
      fr: >-
        Ajoutons un second oxygène au carbone du carbonyle, et voici le groupe carboxyle, la signature des acides carboxyliques.
        L'acide éthanoïque, celui du vinaigre, a pour formule semi-développée CH3-COOH, et son nom se construit avec le mot acide et la terminaison oïque.
        Attention : le groupe hydroxyle d'un acide n'est pas celui d'un alcool, car il est porté par un carbone déjà doublement lié à un oxygène.
        Enfin, deux molécules de même formule brute mais de squelettes ou de groupes différents sont des isomères de constitution, comme l'éthanol et le méthoxyméthane.
      en: >-
        Let us add a second oxygen to the carbon of the carbonyl, and here is the carboxyl group, the signature of carboxylic acids.
        Ethanoic acid, that of vinegar, has the condensed formula CH3-COOH, and its name is built with the word acid and the ending oic.
        Careful: the hydroxyl group of an acid is not that of an alcohol, because it is carried by a carbon already doubly bonded to an oxygen.
        Lastly, two molecules with the same molecular formula but different skeletons or groups are constitutional isomers, like ethanol and methoxymethane.
    actions:
      - { at: 0, show: [carboxyl] }
  - id: play
    kind: play
    title: { fr: "À vous de reconnaître les familles", en: "Your turn to recognise the families" }
    tool: ethanol
    text:
      fr: >-
        À vous. Cliquez sur un atome pour lire ses liaisons et son octet, et affichez ou masquez les groupes caractéristiques.
        Passez d'une molécule à l'autre, éthanol, propanone, éthanal et acide éthanoïque, et nommez chacune à partir de son squelette et de son groupe.
      en: >-
        Your turn. Click an atom to read its bonds and its octet, and show or hide the characteristic groups.
        Switch from one molecule to the next, ethanol, propanone, ethanal and ethanoic acid, and name each one from its skeleton and its group.
    actions:
      - { at: 0, show: [hydroxyl] }
  - id: exercises
    kind: exercises
    title: { fr: "Exercices", en: "Exercises" }
    text:
      fr: >-
        Deux exercices : les isomères d'une formule brute, puis la position d'un groupe dans le nom d'une molécule.
        Saisissez vos réponses ; un indice est disponible si vous bloquez.
      en: >-
        Two exercises: the isomers of a molecular formula, then the position of a group in the name of a molecule.
        Type your answers; a hint is available if you get stuck.
    exercises: [exercise.organic.isomers, exercise.organic.nomenclature_position]
