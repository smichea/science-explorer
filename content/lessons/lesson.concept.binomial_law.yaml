# Leçon rédigée — loi binomiale : arbre de deux épreuves indépendantes, puis l'expérience binomiale à dix
# répétitions (identity: true) qui lit la loi, l'espérance n p et la variance n p (1 − p).
id: lesson.concept.binomial_law
nodeId: concept.binomial_law
depth: 1
tools:
  - id: tree
    kind: random
    title: { fr: "Deux épreuves indépendantes", en: "Two independent trials" }
    mode: tree
    seed: 2019
    tree:
      first:
