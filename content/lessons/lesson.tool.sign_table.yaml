# Leçon — tableau de signes : la courbe du produit (x − a)(x − b) et la bande où il est négatif (paramètres a et b).
id: lesson.tool.sign_table
nodeId: tool.sign_table
depth: 1
tools:
  - id: plotter
    kind: plotter
    variable: x
    view: { x: [-4, 4], y: [-6, 8] }
    parameters:
      - { id: a, label: { fr: "racine a", en: "root a" }, min: -3, max: 3, step: 0.1, value: -2 }
      - { id: b, label: { fr: "racine b", en: "root b" }, min: -3, max: 3, step: 0.1, value: 1 }
    input: true
    initial:
      - { plot: { id: p, expr: "(x-a)*(x-b)", label: { fr: "(x − a)(x − b)", en: "(x − a)(x − b)" } } }
      - { point: { id: r1, on: p, x: "a", guides: true, label: { fr: "x = a", en: "x = a" } } }
      - { point: { id: r2, on: p, x: "b", guides: true, label: { fr: "x = b", en: "x = b" } } }
      - { interval: { id: neg, from: "a", to: "b", label: { fr: "produit négatif", en: "negative product" } } }
