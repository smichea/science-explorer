# Leçon rédigée — dénombrement : principe multiplicatif et factorielle sur le crible (120 = 5!), passage aux
# combinaisons en divisant par les ordres, relation de Pascal, puis les chemins d'un arbre à deux niveaux.
id: lesson.tool.counting
nodeId: tool.counting
depth: 1
tools:
  - id: sieve
    kind: arithmetic
    title: { fr: "Les entiers et leurs diviseurs", en: "The integers and their divisors" }
    max: 120
    highlight: 6
    number: 120
  - id: paths
    kind: random
    title: { fr: "Les chemins d'un arbre", en: "The paths of a tree" }
    mode: tree
    seed: 12
    tree:
      first:
