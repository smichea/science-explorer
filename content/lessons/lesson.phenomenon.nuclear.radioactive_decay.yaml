# Leçon à outil simulation : les diapositives sont composées depuis la description du nœud.
id: lesson.phenomenon.nuclear.radioactive_decay
nodeId: phenomenon.nuclear.radioactive_decay
depth: 1
tools:
  - id: simulation
    kind: simulation
    simulationId: simulation.radioactive.decay
  - id: field
    kind: slope_field
    title: { fr: "Loi de décroissance", en: "Decay law" }
    view: { x: [0, 5], y: [0, 1.1] }
    parameters:
      - { id: l, label: { fr: "constante λ (par unité de temps)", en: "constant λ (per time unit)" }, min: 0.1, max: 2, step: 0.05, value: 0.7 }
    equation: "-l*y"
    labels: { x: "t", y: "N / N₀" }
    solutions:
      - { id: all, x0: 0, y0: 1, label: { fr: "N(0) = N₀", en: "N(0) = N₀" } }
