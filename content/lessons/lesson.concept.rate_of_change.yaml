# Leçon narrée — le taux de variation, avec le traceur (paramètres a et h).
id: lesson.concept.rate_of_change
nodeId: concept.rate_of_change
depth: 1
tool:
  kind: plotter
  variable: x
  view: { x: [-1, 3], y: [-1, 9] }
  parameters:
    - { id: a, label: { fr: "point de départ a", en: "starting point a" }, min: -0.5, max: 2, step: 0.05, value: 1 }
    - { id: h, label: { fr: "largeur h", en: "width h" }, min: 0.02, max: 1.5, step: 0.02, value: 1 }
  input: false
steps:
  - id: average
    title: { fr: "Le taux de variation moyen", en: "The average rate of change" }
    text:
      fr: >-
        Comment mesurer la vitesse à laquelle une fonction varie ?
        Entre deux abscisses, on divise la variation de f par la variation de x : c'est le taux de variation moyen.
        Pour f de x égale x carré, entre 1 et 2, f passe de 1 à 4 : le taux vaut 3.
        Sur la courbe, c'est la pente de la corde qui joint les deux points.
      en: >-
        How can we measure how fast a function varies?
        Between two abscissae, we divide the change of f by the change of x: this is the average rate of change.
        For f of x equals x squared, between 1 and 2, f goes from 1 to 4: the rate is 3.
        On the curve, it is the slope of the chord joining the two points.
    actions:
      - { at: 0, plot: { id: f, expr: "x^2", label: { fr: "f(x) = x²", en: "f(x) = x²" } } }
      - { at: 2, secant: { id: s1, on: f, from: 1, to: 2, label: { fr: "corde de 1 à 2", en: "chord from 1 to 2" } } }
  - id: shrink
    title: { fr: "Rapprocher les deux points", en: "Bringing the two points closer" }
    text:
      fr: >-
        Rapprochons les deux points.
        Entre 1 et 1,5, le taux vaut 2,5.
        Entre 1 et 1,1, il vaut 2,1.
        Plus l'intervalle est court, plus la corde se rapproche d'une position limite : sa pente tend vers 2.
      en: >-
        Let us bring the two points closer.
        Between 1 and 1.5, the rate is 2.5.
        Between 1 and 1.1, it is 2.1.
        The shorter the interval, the closer the chord gets to a limiting position: its slope tends to 2.
    actions:
      - { at: 1, hide: [s1], secant: { id: s2, on: f, from: 1, to: 1.5, label: { fr: "corde de 1 à 1,5", en: "chord from 1 to 1.5" } } }
      - { at: 2, hide: [s2], secant: { id: s3, on: f, from: 1, to: 1.1, label: { fr: "corde de 1 à 1,1", en: "chord from 1 to 1.1" } } }
      - { at: 3, tangent: { id: t1, on: f, x: 1, label: { fr: "position limite", en: "limiting position" } } }
  - id: galileo
    title: { fr: "La question de Galilée", en: "Galileo's question" }
    text:
      fr: >-
        C'est exactement la question de Galilée : quelle est la vitesse de la bille à un instant précis ?
        Une vitesse moyenne se mesure entre deux instants.
        Pour parler de vitesse à un instant, il faut faire tendre la durée vers zéro.
        Cette idée, poussée jusqu'au bout, s'appelle la dérivée.
      en: >-
        This is exactly Galileo's question: what is the speed of the ball at a precise instant?
        An average speed is measured between two instants.
        To speak of speed at an instant, the duration must tend to zero.
        This idea, pushed to its end, is called the derivative.
    actions: []
  - id: play
    kind: play
    title: { fr: "À vous de rapprocher les points", en: "Your turn to bring the points closer" }
    text:
      fr: >-
        À vous. Déplacez a pour choisir le point de départ, puis réduisez h : la corde entre a et a plus h se rapproche de la tangente.
        Lisez la pente affichée et comparez-la à deux fois a.
      en: >-
        Your turn. Move a to choose the starting point, then reduce h: the chord between a and a plus h gets closer to the tangent.
        Read the displayed slope and compare it with twice a.
    actions:
      - { at: 0, clear: true, plot: { id: f, expr: "x^2", label: { fr: "f(x) = x²", en: "f(x) = x²" } }, secant: { id: s, on: f, from: "a", to: "a+h", label: { fr: "corde", en: "chord" } } }
  - id: exercises
    kind: exercises
    title: { fr: "Exercices", en: "Exercises" }
    text:
      fr: >-
        Trois exercices : un taux de variation à calculer, une vitesse moyenne, puis la question de l'instant.
        Saisissez vos réponses ; un indice est disponible si vous bloquez.
      en: >-
        Three exercises: a rate of change to compute, an average speed, then the question of the instant.
        Type your answers; a hint is available if you get stuck.
    exercises: [exercise.rate.average, exercise.rate.speed, exercise.galileo.instantaneous_need]
