# échantillonnage : l'outil tire des échantillons de cent lancers et dessine la concentration des moyennes.
id: lesson.concept.law_of_large_numbers
nodeId: concept.law_of_large_numbers
depth: 1
tools:
  - id: rolls
    kind: random
    title: { fr: "La moyenne de cent lancers", en: "The mean of a hundred rolls" }
