# Leçon — concentration en masse : C = m / V avec le traceur, puis une échelle de teintes (outil ajustement).
id: lesson.concept.concentration
nodeId: concept.concentration
depth: 1
tools:
  - id: plotter
    kind: plotter
    title: { fr: "Concentration en masse", en: "Mass concentration" }
    variable: v
    view: { x: [0, 500], y: [0, 40] }
    parameters:
      - { id: m, label: { fr: "masse de soluté m (g)", en: "mass of solute m (g)" }, min: 1, max: 20, step: 0.5, value: 10 }
    input: false
    initial:
      - { view: { labels: { x: "V (mL)", y: "C (g/L)" } }, plot: { id: c, expr: "1000*m/v", label: { fr: "C = m / V (g/L)", en: "C = m / V (g/L)" } } }
      - { point: { id: p, on: c, x: 250, guides: true, label: { fr: "V = 250 mL", en: "V = 250 mL" } } }
  - id: fit
    kind: fit
    title: { fr: "Échelle de teintes", en: "Colour scale" }
    view: { x: [0, 12], y: [0, 1.2] }
    labels: { x: "C (g/L)", y: "intensité de la teinte" }
    parameters:
      - { id: k, label: { fr: "coefficient k", en: "coefficient k" }, min: 0.02, max: 0.2, step: 0.005, value: 0.1 }
    generator: { expr: "0.09*x", noise: 0.03, count: 5, from: 2, to: 10, seed: 6 }
    models:
      - { id: scale, expr: "k*x", label: { fr: "échelle de teintes", en: "colour scale" } }
    target: 7
