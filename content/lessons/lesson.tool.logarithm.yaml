# Leçon composée depuis la description du nœud — le traceur porte la courbe du logarithme, celle de
# l'exponentielle et la droite y = x qui les échange ; le point mobile lit ln(a) pendant le jeu libre.
id: lesson.tool.logarithm
nodeId: tool.logarithm
depth: 1
tools:
  - id: plot
    kind: plotter
    title: { fr: "Le logarithme et l'exponentielle", en: "The logarithm and the exponential" }
    variable: x
    view: { x: [-1, 6], y: [-3, 6] }
    parameters:
      - { id: a, label: { fr: "abscisse a", en: "abscissa a" }, min: 0.05, max: 6, step: 0.05, value: 2.7 }
    input: true
    initial:
      - { at: 0, plot: { id: l, expr: "ln(x)", label: { fr: "ln(x)", en: "ln(x)" } } }
      - { at: 0, plot: { id: ex, expr: "exp(x)", dashed: true, label: { fr: "exp(x)", en: "exp(x)" } } }
      - { at: 0, line: { id: bis, a: 1, b: -1, c: 0, dashed: true, label: { fr: "y = x", en: "y = x" } } }
      - { at: 0, point: { id: pa, on: l, x: "a", guides: true, label: { fr: "ln(a)", en: "ln(a)" } } }
