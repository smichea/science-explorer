# Leçon à outil simulation : les diapositives sont composées depuis la description du nœud.
id: lesson.phenomenon.motion.with_drag
nodeId: phenomenon.motion.with_drag
depth: 1
tools:
  - id: simulation
    kind: simulation
    simulationId: simulation.motion.drag
  - id: field
    kind: slope_field
    title: { fr: "Équation de la vitesse", en: "Velocity equation" }
    view: { x: [0, 8], y: [0, 25] }
    parameters:
      - { id: k, label: { fr: "coefficient de frottement k (s⁻¹)", en: "drag coefficient k (s⁻¹)" }, min: 0.1, max: 2, step: 0.05, value: 0.5 }
    equation: "9.8 - k*y"
    labels: { x: "t (s)", y: "v (m/s)" }
    solutions:
      - { id: rest, x0: 0, y0: 0, label: { fr: "lâchée sans vitesse", en: "released at rest" } }
      - { id: fast, x0: 0, y0: 24, label: { fr: "lancée vite", en: "thrown fast" } }
