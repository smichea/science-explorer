        Saisissez vos réponses ; un indice est disponible si vous bloquez.
      en: >-
        Two exercises: the concentration of an ion in a solution, then an extraction by a solvent.
        Type your answers; a hint is available if you get stuck.
    exercises: [exercise.cohesion.ion_concentration, exercise.cohesion.extraction]
