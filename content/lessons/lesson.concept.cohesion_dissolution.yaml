# Leçon narrée — cohésion et dissolution : le solide ionique et le solide moléculaire, la dissolution du chlorure de sodium
# (outil réaction : dissociation, solvatation, dispersion et concentrations des ions), la molécule d'eau polaire et l'extraction.
