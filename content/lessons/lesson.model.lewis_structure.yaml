# Leçon narrée — schéma de Lewis : les doublets de l'eau construits liaison par liaison, la géométrie tétraédrique du méthane,
# le doublet non liant de l'ammoniac, puis l'électronégativité et la polarité comparées sur le dioxyde de carbone et l'eau.
