# Leçon — suites arithmétiques et géométriques : les termes d'une suite arithmétique b + r n (outil suites) et, sur le
# traceur, la droite b + r x face à la courbe 3 q^x, pour voir la croissance linéaire perdre contre la croissance géométrique.
id: lesson.tool.arithmetic_geometric_sequences
nodeId: tool.arithmetic_geometric_sequences
depth: 1
tools:
  - id: terms
    kind: sequence
    title: { fr: "Une suite arithmétique : u(n) = u₀ + n r", en: "An arithmetic sequence: u(n) = u₀ + n r" }
    view: { x: [0, 12], y: [-5, 40] }
    parameters:
      - { id: b, label: { fr: "premier terme u₀", en: "first term u₀" }, min: -5, max: 10, step: 1, value: 3 }
      - { id: r, label: { fr: "raison r", en: "common difference r" }, min: -3, max: 5, step: 0.5, value: 2 }
    mode: explicit
    expr: "b+r*n"
    start: 0
    count: 12
    input: true
  - id: plotter
    kind: plotter
    title: { fr: "Droite contre exponentielle : u₀ + n r face à 3 q^n", en: "Line against exponential: u₀ + n r versus 3 q^n" }
    variable: x
    view: { x: [0, 10], y: [-5, 45] }
    parameters:
      - { id: r, label: { fr: "raison arithmétique r", en: "common difference r" }, min: -3, max: 5, step: 0.5, value: 2 }
      - { id: q, label: { fr: "raison géométrique q", en: "common ratio q" }, min: 0.5, max: 2, step: 0.1, value: 1.3 }
    input: true
    initial:
      - { plot: { id: arith, expr: "3+r*x", dashed: true, label: { fr: "arithmétique : 3 + r n", en: "arithmetic: 3 + r n" } } }
      - { plot: { id: geom, expr: "3*q^x", label: { fr: "géométrique : 3 q^n", en: "geometric: 3 q^n" } } }
      - { point: { id: cross, on: geom, x: 10, guides: true, label: { fr: "au bout de dix pas", en: "after ten steps" } } }
