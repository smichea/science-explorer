# Leçon — le champ électrique, le champ de gravitation et le champ uniforme, avec trois cartes de champ (une charge ponctuelle, la Terre, un condensateur plan).
id: lesson.concept.field
nodeId: concept.field
depth: 1
tools:
  - id: point_charge
    kind: vector_field
    title: { fr: "Le champ d'une charge ponctuelle", en: "The field of a point charge" }
    view: { x: [-0.3, 0.3], y: [-0.3, 0.3] }
    mode: electric
    grid: 12
    parameters:
      - { id: q, label: { fr: "charge Q (nC)", en: "charge Q (nC)" }, min: -8, max: 8, step: 0.5, value: 1 }
    sources:
      - { id: source, x: 0, y: 0, value: "q*1e-9", label: { fr: "Q", en: "Q" }, drag: true }
    marker: { x: 0.1, y: 0 }
    test: 1e-9
    labels: { x: "x (m)", y: "y (m)" }
  - id: earth
    kind: vector_field
    title: { fr: "Le champ de gravitation de la Terre", en: "The gravitational field of the Earth" }
    view: { x: [-20000000, 20000000], y: [-20000000, 20000000] }
    mode: gravitational
    grid: 12
    parameters:
      - { id: m, label: { fr: "masse de l'astre (masses terrestres)", en: "mass of the body (Earth masses)" }, min: 0.1, max: 3, step: 0.1, value: 1 }
    sources:
      - { id: planet, x: 0, y: 0, value: "m*5.97e24", label: { fr: "Terre", en: "Earth" } }
    marker: { x: 6370000, y: 0 }
    test: 1
    labels: { x: "x (m)", y: "y (m)" }
  - id: capacitor
    kind: vector_field
    title: { fr: "Le champ uniforme d'un condensateur plan", en: "The uniform field of a plane capacitor" }
    view: { x: [-0.15, 0.15], y: [-0.1, 0.1] }
    mode: uniform
    grid: 10
    parameters:
      - { id: u, label: { fr: "tension entre les armatures U (V)", en: "voltage between the plates U (V)" }, min: 0, max: 400, step: 20, value: 200 }
    uniform: { x: 0, y: "-u/0.1" }
    marker: { x: 0, y: 0 }
    test: 1e-9
    labels: { x: "x (m)", y: "y (m)" }
