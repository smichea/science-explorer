# Leçon — vocabulaire ensembliste et logique : le crible (le contre-exemple 2 à « tout premier est impair ») et le traceur (si x > a alors x² > a²).
id: lesson.concept.logic_sets
nodeId: concept.logic_sets
depth: 1
tools:
  - id: sieve
    kind: arithmetic
    title: { fr: "Un contre-exemple : le nombre 2", en: "A counter-example: the number 2" }
    max: 60
    highlight: 2
    number: 2
  - id: plotter
    kind: plotter
    title: { fr: "Si x > a alors x² > a²", en: "If x > a then x² > a²" }
    variable: x
    view: { x: [-4, 4], y: [-1, 10] }
    parameters:
      - { id: a, label: { fr: "seuil a", en: "threshold a" }, min: -3, max: 3, step: 0.1, value: 2 }
    input: true
    initial:
      - { plot: { id: f, expr: "x^2", label: { fr: "x²", en: "x²" } } }
      - { point: { id: p, on: f, x: "a", guides: true, label: { fr: "(a ; a²)", en: "(a, a²)" } } }
      - { interval: { id: i, from: "a", to: 4, label: { fr: "x > a", en: "x > a" } } }
