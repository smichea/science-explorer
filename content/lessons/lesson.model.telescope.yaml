# Leçon — la lunette astronomique afocale : objectif, oculaire, image intermédiaire et grossissement
# (outil optique en mode lunette, avec les trois curseurs des distances focales et du diamètre apparent).
id: lesson.model.telescope
nodeId: model.telescope
