# Leçon narrée — oxydoréduction : couples Cu²⁺/Cu et Zn²⁺/Zn (demi-équations à 2 électrons), puis Fe³⁺/Fe²⁺ contre le zinc
# (1 électron contre 2 : les multiplicateurs), avec l'outil réaction et ses demi-équations.
id: lesson.model.redox
nodeId: model.redox
depth: 1
tools:
  - id: copper
    kind: reaction
    title: { fr: "Zinc et ions cuivre II", en: "Zinc and copper II ions" }
    parameters:
      - { id: a, label: { fr: "ions Cu²⁺ initiaux (mol)", en: "initial Cu²⁺ ions (mol)" }, min: 0, max: 0.1, step: 0.005, value: 0.02 }
      - { id: b, label: { fr: "zinc initial (mol)", en: "initial zinc (mol)" }, min: 0, max: 0.1, step: 0.005, value: 0.05 }
    reactants:
      - { id: zinc, formula: "Zn", coefficient: 1, initial: "b", label: { fr: "zinc", en: "zinc" } }
      - { id: copper_ion, formula: "Cu²⁺", coefficient: 1, initial: "a", label: { fr: "ions cuivre II", en: "copper II ions" } }
    products:
      - { id: zinc_ion, formula: "Zn²⁺", coefficient: 1 }
      - { id: copper_metal, formula: "Cu", coefficient: 1 }
    unit: mol
    halfEquations:
      - { id: oxidation, left: "Zn", right: "Zn²⁺", electrons: 2, role: oxidation }
      - { id: reduction, left: "Cu²⁺", right: "Cu", electrons: 2, role: reduction }
  - id: iron
    kind: reaction
    title: { fr: "Zinc et ions fer III", en: "Zinc and iron III ions" }
    parameters:
      - { id: a, label: { fr: "ions Fe³⁺ initiaux (mol)", en: "initial Fe³⁺ ions (mol)" }, min: 0, max: 0.1, step: 0.005, value: 0.06 }
      - { id: b, label: { fr: "zinc initial (mol)", en: "initial zinc (mol)" }, min: 0, max: 0.1, step: 0.005, value: 0.02 }
    reactants:
      - { id: zinc, formula: "Zn", coefficient: 1, initial: "b", label: { fr: "zinc", en: "zinc" } }
      - { id: iron3, formula: "Fe³⁺", coefficient: 2, initial: "a", label: { fr: "ions fer III", en: "iron III ions" } }
    products:
      - { id: zinc_ion, formula: "Zn²⁺", coefficient: 1 }
      - { id: iron2, formula: "Fe²⁺", coefficient: 2 }
    unit: mol
    halfEquations:
